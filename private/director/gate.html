<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>需要访问密钥 · 导演组流程脚本工作站</title>
<style>
/* ============================================================
   门禁页（自包含，不引用站点样式，避免路径失效）
   视觉沿用工作台「深色指挥室」令牌，让门禁与工作台连成一体
   ============================================================ */
:root{
  color-scheme:dark;
  --bg:#0A0F16;
  --card:#111A25;
  --card-2:#141E2A;
  --line:#253344;
  --ink-1:#E9EFF6;
  --ink-2:#B9C7D8;
  --ink-4:#8497AE;
  --brand:#1A6FC4;
  --brand-hi:#2C87D8;
  --danger:#E5674E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 620px at 50% -10%, rgba(26,111,196,.16), transparent 62%),
    var(--bg);
  color:var(--ink-1);
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:28px 20px;
  -webkit-font-smoothing:antialiased;
}
.wrap{width:100%;max-width:432px}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:38px 34px 30px;
  box-shadow:0 18px 50px rgba(0,0,0,.5);
}
.mark{display:flex;align-items:center;gap:11px;margin-bottom:24px}
.mark svg{display:block;flex:none}
.mark span{
  font-size:12.5px;letter-spacing:.14em;color:var(--ink-4);
  text-transform:uppercase;font-weight:600;
}

h1{font-size:22px;font-weight:700;letter-spacing:.01em;margin-bottom:9px}
.desc{font-size:13.5px;color:var(--ink-2);margin-bottom:26px}

label{display:block;font-size:12px;color:var(--ink-4);margin-bottom:7px;letter-spacing:.03em}
.row{display:flex;gap:9px}
input[type=text]{
  flex:1;min-width:0;
  background:var(--card-2);
  border:1px solid var(--line);
  border-radius:9px;
  padding:11px 13px;
  color:var(--ink-1);
  font:inherit;font-size:15px;
  letter-spacing:.06em;
  font-variant-numeric:tabular-nums;
  transition:border-color .15s, box-shadow .15s;
}
input[type=text]::placeholder{color:var(--ink-4);letter-spacing:0}
input[type=text]:focus{
  outline:none;
  border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(26,111,196,.26);
}
button{
  flex:none;
  background:var(--brand);
  border:1px solid transparent;
  border-radius:9px;
  padding:11px 18px;
  color:#fff;font:inherit;font-size:14px;font-weight:600;
  cursor:pointer;
  transition:background .15s, transform .06s;
}
button:hover{background:var(--brand-hi)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--brand-hi);outline-offset:2px}

.err{
  margin-top:12px;font-size:13px;color:var(--danger);
  display:none;
}
.err.show{display:block}

.hint{
  margin-top:20px;padding-top:18px;
  border-top:1px solid var(--line);
  font-size:12.5px;color:var(--ink-4);
}
.hint code{
  background:var(--card-2);border:1px solid var(--line);
  border-radius:5px;padding:1px 6px;
  font-size:12px;color:var(--ink-2);
  word-break:break-all;
}
.hint p+p{margin-top:7px}

.foot{text-align:center;margin-top:18px;font-size:12.5px}
.foot a{color:var(--ink-4);text-decoration:none;border-bottom:1px solid transparent}
.foot a:hover{color:var(--ink-2);border-bottom-color:var(--line)}

@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media (max-width:480px){
  .card{padding:30px 22px 26px}
  .row{flex-direction:column}
  button{padding:12px 18px}
}
</style>
</head>
<body>
<main class="wrap">
  <div class="card">
    <div class="mark">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7.5" fill="#1A6FC4"/>
        <path d="M6 12V6h6M20 6h6v6M26 20v6h-6M12 26H6v-6" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12.6 11.8L19.8 16l-7.2 4.2z" fill="#fff"/>
      </svg>
      <span>导演组 · 流程脚本工作站</span>
    </div>

    <h1>需要访问密钥</h1>
    <p class="desc">此工作站仅限剧组内部使用。请通过带访问密钥的专属链接进入，或在下方直接输入密钥。</p>

    <form id="gateForm" autocomplete="off">
      <label for="gateKey">访问密钥</label>
      <div class="row">
        <input id="gateKey" type="text" placeholder="粘贴访问密钥"
               autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button type="submit">进入工作站</button>
      </div>
      <p class="err" id="gateErr" role="alert">密钥不正确，请重新输入。</p>
    </form>

    <div class="hint">
      <p>正确的链接形如：</p>
      <p><code>…/private/director/?key=你的访问密钥</code></p>
      <p>如需获取密钥，请联系管理员。</p>
    </div>
  </div>

  <p class="foot"><a href="../../">← 返回公开站</a></p>
</main>

<script>
/* 源码中只保存密钥的 SHA-256 哈希，密钥本体不入库。
   换密钥时请同时替换以下三处常量：本文件、index.html、screen.html。 */
var WORKSTATION_KEY_HASH = '2fe115eb0dac3a086b2cfee19270bd20d59156b2697bb2d0dcf9d6c47921154b';
function sha256Hex(str) {
            // 纯 JS SHA-256（用于兼容非 https 的本地打开场景）
            function rightRotate(value, amount) {
                return (value >>> amount) | (value << (32 - amount));
            }
            var mathPow = Math.pow, maxWord = mathPow(2, 32), lengthProperty = 'length';
            var result = '', i, j;
            var words = [], asciiBitLength = str[lengthProperty] * 8;
            var hash = sha256Hex.h = sha256Hex.h || [];
            var k = sha256Hex.k = sha256Hex.k || [];
            var primeCounter = k[lengthProperty];
            var isComposite = {};
            for (var candidate = 2; primeCounter < 64; candidate++) {
                if (!isComposite[candidate]) {
                    for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
                    hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
                    k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
                }
            }
            str += '\x80';
            while (str[lengthProperty] % 64 - 56) str += '\x00';
            for (i = 0; i < str[lengthProperty]; i++) {
                j = str.charCodeAt(i);
                if (j >> 8) return '';
                words[i >> 2] |= j << ((3 - i) % 4) * 8;
            }
            words[words[lengthProperty]] = ((asciiBitLength / maxWord) | 0);
            words[words[lengthProperty]] = (asciiBitLength);
            for (j = 0; j < words[lengthProperty];) {
                var w = words.slice(j, j += 16);
                var oldHash = hash.slice(0, 8);
                for (i = 0; i < 64; i++) {
                    var w15 = w[i - 15], w2 = w[i - 2];
                    var a = hash[0], e = hash[4];
                    var temp1 = hash[7]
                        + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
                        + ((e & hash[5]) ^ ((~e) & hash[6]))
                        + k[i]
                        + (w[i] = (i < 16) ? w[i] : (
                            w[i - 16]
                            + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                            + w[i - 7]
                            + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
                        ) | 0);
                    var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
                        + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
                    hash = [(temp1 + temp2) | 0].concat(hash);
                    hash[4] = (hash[4] + temp1) | 0;
                }
                for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
            }
            for (i = 0; i < 8; i++) {
                for (j = 3; j + 1; j--) {
                    var b = (hash[i] >> (j * 8)) & 255;
                    result += ((b < 16) ? 0 : '') + b.toString(16);
                }
            }
            return result;
        }

document.getElementById('gateForm').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var val = document.getElementById('gateKey').value.replace(/^\s+|\s+$/g, '');
  var errEl = document.getElementById('gateErr');
  if (val && sha256Hex(val) === WORKSTATION_KEY_HASH) {
    try { sessionStorage.setItem('director_unlocked', '1'); } catch (e) {}
    /* 重定向到带 key 的地址，这样地址栏本身就是一条可复制的专属链接 */
    location.replace('index.html?key=' + encodeURIComponent(val));
  } else {
    errEl.classList.add('show');
    document.getElementById('gateKey').focus();
    document.getElementById('gateKey').select();
  }
});
</script>
</body>
</html>
