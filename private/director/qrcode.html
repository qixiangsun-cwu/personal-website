<title>法规库二维码总表 · 扫码即读</title>
<style>
:root{ --brand:#1A6FC4; --ink:#1F2D3D; --ink2:#4A5A6C; --ink3:#8497AE; --line:#DFE6EF; --bg:#F6F8FB; }
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;line-height:1.55;padding:28px 20px 48px;}
.wrap{max-width:1180px;margin:0 auto;}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--brand);padding-bottom:12px;margin-bottom:8px;}
.head h1{font-size:22px;letter-spacing:.5px;}
.head .sub{font-size:12.5px;color:var(--ink2);}
.head .sp{flex:1;}
.head .meta{font-size:12px;color:var(--ink3);text-align:right;}
.note{font-size:12.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:14px 0 20px;}
.note b{color:var(--brand);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.cell{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;position:relative;}
.cell .no{position:absolute;left:10px;top:9px;background:var(--brand);color:#fff;font:700 11px/1 Consolas,monospace;border-radius:4px;padding:3px 6px;}
.cell .qr{display:block;margin-top:14px;}
.cell .qr img{width:100%;height:auto;display:block;}
.cell figcaption .t{font-size:12.5px;font-weight:700;line-height:1.45;min-height:2.9em;}
.cell figcaption .m{font-size:11px;color:var(--ink3);margin-top:2px;}
.cell .go{display:inline-block;margin-top:6px;font-size:11.5px;color:var(--brand);text-decoration:none;}
.cat{background:#F9FBFE;}
h2{font-size:15px;margin:26px 0 12px;color:var(--ink);}
h2 small{font-weight:400;color:var(--ink3);font-size:12px;margin-left:8px;}
.grid.cats{grid-template-columns:repeat(6,1fr);}
.foot{margin-top:24px;font-size:11.5px;color:var(--ink3);display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;}
@media (max-width:980px){ .grid{grid-template-columns:repeat(3,1fr);} .grid.cats{grid-template-columns:repeat(3,1fr);} }
@media (max-width:680px){ .grid{grid-template-columns:repeat(2,1fr);} .grid.cats{grid-template-columns:repeat(2,1fr);} }
@media print{
  body{background:#fff;padding:0;}
  .no-print{display:none!important;}
  .wrap{max-width:none;}
  .note{display:none;}
  .grid{grid-template-columns:repeat(4,1fr);gap:8px;}
  .cell{break-inside:avoid;border-color:#ccc;}
  .cell .go{display:none;}
  @page{ size:A4 portrait; margin:12mm; }
}
</style>
