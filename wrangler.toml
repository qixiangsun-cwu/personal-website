# 个人网站 · Cloudflare Pages 配置（Git 自动部署，main 分支）
# 主站为 Git Provider 自动部署，本文件仅用于本地 pages dev 与 settings 同步。
name = "personal-website"
pages_build_output_dir = "."
compatibility_date = "2025-07-18"

# 导演工作台 · 各组提案存储（Pages Function: functions/private/director/proposals.js）
# 主用 D1（绑定变量 DB）；代码首次请求会自动建表 proposals / meta / usage
[[d1_databases]]
binding = "DB"
database_name = "director-proposals"
database_id = "fa70aa19-4f3c-40b1-8449-3f9bc85a8f06"

# KV 兜底（D1 不可用时自动退回；保留不删）
# 绑定变量名 PROPOSALS；命名空间名 director-proposals，创建于 2026-10-26
[[kv_namespaces]]
binding = "PROPOSALS"
id = "74e6d97acf4a44828ae0c34d4548e742"
