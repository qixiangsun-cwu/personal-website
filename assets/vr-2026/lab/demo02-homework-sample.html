</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h2 id="hudTitle">LAB</h2>
  <div class="tagline" id="hudTag"></div>

<!-- 右侧 DOM 侧栏：内容由脚本根据交互注册表自动生成 -->
<div id="side">
  <h2>作业样板 · 自动自检</h2>
  <div class="sub">《交互清单》由场景注册表自动生成，不手写</div>
  <table>
    <thead><tr><th>交互名</th><th>触发</th><th>反馈</th><th>PC</th><th>VR</th><th>备注</th></tr></thead>
    <tbody id="invBody"></tbody>
  </table>

    ② 三条达标线必须全 ✔ 才算交作业；<br>

<script src="./three.min.js"></script>
<script>
/* =========================================================================
 * 组 D2 · 作业样板：6×6 m 房间 + 三项交互 + 自动《交互清单》/ 三条达标线
 * 第 7 次课「交互零件库」课后作业的样板答案：学生照这个结构交作业即可。
 *   ① 墙上的 3D 控制面板 → 改灯光颜色 / 亮度
 *   ② 桌上可抓取的台灯 → 抓到后放到指定展示台（到位有反馈）
 *   ③ 篮子 + 3 个小球 → 投进 +1（计数）
 * 右侧 DOM 侧栏自动生成《交互清单》表格与三条达标线自检；按 A 进注释模式。
 *
 * 硬性约定（验证工具依赖，不要删）：
 *   1. <script src="./three.min.js">（带点斜杠）
 *   2. 存在行  renderer.setAnimationLoop(animate);
 *   3. animate() 内调用 renderer.render(scene, camera)
 *   4. renderer.xr.setReferenceSpaceType('local-floor') 在会话创建前调用
 *   5. 暴露 window.LAB（含 api.selfTest）
 * ========================================================================= */
(function(){
'use strict';

/* ======================= 0. 演示配置 ======================= */
var CFG = {
  id: 'demo02',
  title: '作业样板 · 三项交互',
  subtitle: '第 7 次课 · 6×6 m 房间 / 自动交互清单 / 三条达标线自检',
  part: '作业样板 D2',
  aimMode: 'mouse',
  pcKeys: '拖拽=环视 · W/A/S/D=行走 · 左键=点按钮 / 抓台灯 / 拿球 · ' +
          '<span class="k">A</span>=注释模式 · <span class="k">R</span>=重置 · <span class="k">1/2/3</span>=拿球',
  vrKeys: '扳机=射线点面板 / 台灯 / 球 · 握持键=抓取，松开=放下（台灯靠近展示台会自动吸附）· ' +
          '右摇杆左右=转 45°',
  teach: '① 一个交互的最小完整定义 = 触发 + 反馈 + 可达性（PC/VR 各一条通路）。' +
         '② 达标线不是写作文：能进能退 / ≥3 种交互 / 控制台无报错，页面上自动判。' +
         '③ 注释模式把设计意图标在物体上，截图与答辩都能直接用。',
  hudLines: function(){
    return [
      '交互已触发 ' + S.triggered + ' / 3 项 ｜ 注释模式：' + (S.comment ? '开' : '关'),
      '灯光：' + LIGHT_NAMES[S.colorIdx] + ' · 亮度档 ' + (S.level + 1) + '/4',
      '投球入篮 ' + S.basket + ' 个 ｜ 台灯：' + (S.lampPlaced ? '已放到展示台' : (S.lampHeld ? '被抓起' : '在桌上'))
    ];
  }
};

/* 墙体/房间尺寸 */
var ROOM = { half: 3.0, h: 3.0 };

/* ======================= 1. 基础设施 ======================= */
var renderer, scene, camera, player, clock, audioCtx = null;
var raycaster = new THREE.Raycaster();
var aimNdc = new THREE.Vector2(0, 0);
var tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();
var panel = null, panelCanvas = null, panelCtx = null, panelTex = null;
var panelBtns = [], hoverId = null, panelDirty = true;
var uiHits = [], pickables = [];
var hapticLog = [], sfxLog = [];
var keys = {}, dragging = false, lastMouse = {x:0,y:0}, dragDist = 0;
var vrCtrls = [], vrRays = [], xrSession = null;
var elapsed = 0, frames = 0, fps = 60, fpsT = 0;

/* -------- 1.1 状态 -------- */
var S = {
  colorIdx: 0, level: 1,          // 灯光颜色 / 亮度档（0—3）
  comment: false,                  // 注释模式
  triggered: 0,                    // 已触发过的交互数（0—3）
  lampHeld: false, lampPlaced: false, lampHolder: null,
  basket: 0, ballsThrown: 0, heldBall: null,
  hasEnter: false, hasExit: false,
  gates: { enter: false, count: false, noerr: false },
  lastAction: '—', lastPick: '—', picks: 0, mute: false
};
var LIGHT_COLORS = [
  { name: '暖白', hex: 0xffd9a0 },
  { name: '冷白', hex: 0xcfe0ff },
  { name: '霓虹紫', hex: 0xc79cff }
];
var LIGHT_NAMES = ['暖白', '冷白', '霓虹紫'];
var LEVEL_INTENSITY = [0.55, 1.15, 1.95, 2.9];
var LEVEL_AMBIENT = [0.18, 0.32, 0.5, 0.72];

/* 交互注册表：EXACTLY 三行，侧栏表格与自测都读它 */
var INTERACTIONS = [
  {
    id: 'light', name: '① 灯光面板',
    trigger: 'PC 左键点面板按钮；VR 扳机射线点按钮',
    feedback: '房间灯光颜色/亮度变化 + 提示音 + 震动 + 面板读数',
    pc: true, vr: true,
    note: '面板挂在 z=-2.9 m 墙上、高度 1.3—2.5 m（坐姿也够得到）',
    fired: false
  },
  {
    id: 'lamp', name: '② 抓取台灯',
    trigger: 'PC 点台灯抓起 → 点绿色展示台放下；VR 握持键抓起 → 靠近展示台松手',
    feedback: '吸附到位 + 绿光闪 + 提示音 + 震动',
    pc: true, vr: true,
    note: 'VR 需要走到展示台旁（本样板没做瞬移，可作下一步改进）',
    fired: false
  },
  {
    id: 'ball', name: '③ 投球入篮',
    trigger: 'PC 点球抓起 → 再点任意处投出；VR 握持键抓球 → 松开投出',
    feedback: '篮筐计数 +1 + 提示音 + 震动 + 飘字',
    pc: true, vr: 'cond',
    note: 'VR 投掷已写（手柄速度 EMA），未在真机验证 → 课堂上以 PC 演示为准',
    fired: false
  }
];
var errCount = 0;
var G = 9.8;

/* 演示私有对象 */
var errSeen = [];
var roomLight = null, lampLight = null, ceilLamp = null;
var table = null, lampGroup = null, lampHome = new THREE.Vector3();
var pedestal = null, pedestalRing = null, pedestalTopY = 0.8;
var basketGroup = null, basketRim = null;
var trayGroup = null, balls = [], ballHomes = [], ballTrayY = 0.53;
var BASKET = { x: -2.25, y: 0.52, z: -2.45, r: 0.28 };
var BALL_R = 0.09;
var labelsGroup = null, outlinesGroup = null, lampOutline = null;
var heldAnchor = null, popups = [];
var DEMO_READY = false;

/* -------- 1.2 小工具 -------- */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function fmt(v, n){ return (isFinite(v) ? v.toFixed(n == null ? 2 : n) : '—'); }
function $(id){ return document.getElementById(id); }
function toast(msg, ms){
  var t = $('toast');
  if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, ms || 1600);
}
function initAudio(){
  if (audioCtx) return audioCtx;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  } catch (e) { console.warn('AudioContext 不可用', e); }
  return audioCtx;
}
function resumeAudio(){
  var c = initAudio();
  if (c && c.state === 'suspended') c.resume().catch(function(){});
}
function beep(freq, dur, type, gain){
  var c = initAudio();
  if (!c || S.mute) { sfxLog.push({t: elapsed, freq: freq, skipped: !c}); return; }
  try {
    if (c.state === 'suspended') c.resume().catch(function(){});
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = (gain == null ? 0.05 : gain);
    o.connect(g); g.connect(c.destination);
    var now = c.currentTime, d = (dur || 60) / 1000;
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + d);
    o.start(now); o.stop(now + d + 0.01);
    sfxLog.push({t: elapsed, freq: freq, dur: dur || 60});
  } catch (e) { console.warn('beep 失败', e); }
}
function pulse(src, intensity, ms){
  hapticLog.push({t: elapsed, intensity: intensity, ms: ms, real: !!(src && src.gamepad &&
    src.gamepad.hapticActuators && src.gamepad.hapticActuators[0])});
  try {
    var acts = src && src.gamepad && src.gamepad.hapticActuators;
    if (acts && acts[0] && acts[0].pulse) acts[0].pulse(intensity, ms);
  } catch (e) { console.warn('触觉不可用', e); }
}

/* -------- 1.3 3D 面板（CanvasTexture + UV 命中） -------- */
function mkPanel(wM, hM, pxW, pxH){
  panelCanvas = document.createElement('canvas');
  panelCanvas.width = pxW; panelCanvas.height = pxH;
  panelCtx = panelCanvas.getContext('2d');
  panelTex = new THREE.CanvasTexture(panelCanvas);
  panelTex.minFilter = THREE.LinearFilter;
  var mat = new THREE.MeshBasicMaterial({ map: panelTex, transparent: true });
  panel = new THREE.Mesh(new THREE.PlaneGeometry(wM, hM), mat);
  panel.name = 'uiPanel';
  panelBtns = [];
  return panel;
}
function uiButton(id, label, px, py, pw, ph, enabled){
  panelBtns.push({ id: id, label: label, x: px, y: py, w: pw, h: ph, enabled: enabled !== false });
}
function drawButtons(ctx, W, H){
  for (var i = 0; i < panelBtns.length; i++) {
    var b = panelBtns[i], on = (hoverId === b.id);
    ctx.fillStyle = !b.enabled ? '#2a3346' : (on ? '#3f8ae0' : '#24314c');
    ctx.strokeStyle = on ? '#9fd0ff' : '#3a4a6c';
    ctx.lineWidth = on ? 3 : 2;
    roundRect(ctx, b.x, b.y, b.w, b.h, 10);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = !b.enabled ? '#6b7688' : (on ? '#ffffff' : '#d5e3f8');
    ctx.font = 'bold 26px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function redrawPanel(){
  if (!panelCtx) return;
  var W = panelCanvas.width, H = panelCanvas.height;
  panelCtx.clearRect(0, 0, W, H);
  DEMO.drawUI(panelCtx, W, H);
  drawButtons(panelCtx, W, H);
  panelTex.needsUpdate = true;
  panelDirty = false;
}
function uiHitUV(uv){
  if (!uv) return null;
  var px = uv.x * panelCanvas.width, py = (1 - uv.y) * panelCanvas.height;
  for (var i = 0; i < panelBtns.length; i++) {
    var b = panelBtns[i];
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return b;
  }
  return null;
}

/* -------- 1.4 拾取 -------- */
function castFrom(origin, dir, objs){
  raycaster.set(origin, dir.clone().normalize());
  raycaster.far = 30;
  var hits = raycaster.intersectObjects(objs, true);
  return hits && hits.length ? hits[0] : null;
}
function pickPanel(origin, dir, src){
  var h = castFrom(origin, dir, [panel]);
  if (!h) return null;
  var b = uiHitUV(h.uv);
  return { button: b, point: h.point, distance: h.distance, source: src };
}
function pickWorld(origin, dir, src){
  var list = pickables.map(function(p){ return p.mesh; });
  var h = castFrom(origin, dir, list);
  if (!h) return null;
  var obj = h.object, owner = null;
  while (obj && !owner) {
    for (var i = 0; i < pickables.length; i++) if (pickables[i].mesh === obj) owner = pickables[i];
    obj = obj.parent;
  }
  return owner ? { item: owner, point: h.point, distance: h.distance, source: src } : null;
}
function registerPick(mesh, id, onPick){
  pickables.push({ mesh: mesh, id: id, onPick: onPick || function(){} });
  return mesh;
}

/* -------- 1.5 PC 输入 -------- */
function setupPC(){
  var cvs = renderer.domElement;
  cvs.addEventListener('pointerdown', function(e){
    resumeAudio();
    dragging = true; dragDist = 0; lastMouse.x = e.clientX; lastMouse.y = e.clientY;
    cvs.setPointerCapture && cvs.setPointerCapture(e.pointerId);
  });
  cvs.addEventListener('pointermove', function(e){
    var dx = e.clientX - lastMouse.x, dy = e.clientY - lastMouse.y;
    lastMouse.x = e.clientX; lastMouse.y = e.clientY;
    if (dragging) {
      dragDist += Math.abs(dx) + Math.abs(dy);
      player.rotation.y -= dx * 0.0032;
      camera.rotation.x = clamp(camera.rotation.x - dy * 0.0032, -1.15, 1.0);
    } else {
      updateMouseAim(e);
    }
  });
  cvs.addEventListener('pointerup', function(e){
    if (dragging && dragDist < 6) { resumeAudio(); doClick(e); }
    dragging = false;
  });
  cvs.addEventListener('pointercancel', function(){ dragging = false; });
  window.addEventListener('keydown', function(e){
    keys[e.code] = true;
    if (e.code === 'KeyR') { DEMO.reset(); toast('已重置场景'); }
    else if (e.code === 'KeyT' && DEMO.onKey) DEMO.onKey('KeyT');
    else if (DEMO.onKey) DEMO.onKey(e.code);
  });
  window.addEventListener('keyup', function(e){ keys[e.code] = false; });
  window.addEventListener('resize', onResize);
  /* 侧栏按钮（PC 专用 DOM）：不算 3D 交互，只是便捷入口 */
  var bc = $('btnCmt'), br = $('btnReset');
  if (bc) bc.addEventListener('click', function(){ fireButton('comment', 'dom'); });
  if (br) br.addEventListener('click', function(){ DEMO.reset(); });
}
function updateMouseAim(e){
  var r = renderer.domElement.getBoundingClientRect();
  aimNdc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  aimNdc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}
function pcRay(){
  camera.getWorldPosition(tmpV);
  var dir = new THREE.Vector3();
  if (CFG.aimMode === 'center') {
    camera.getWorldDirection(dir);
  } else {
    dir.set(aimNdc.x, aimNdc.y, 0.5).unproject(camera).sub(tmpV).normalize();
  }
  return { origin: tmpV.clone(), dir: dir };
}
function doClick(e){
  var r = pcRay();
  var p = pickPanel(r.origin, r.dir, 'pc');
  if (p && p.button) { fireButton(p.button.id, 'pc'); return; }
  var w = pickWorld(r.origin, r.dir, 'pc');
  if (w) { w.item.onPick(w); return; }

/* -------- 1.6 VR 输入 -------- */
function setupVR(){
  for (var i = 0; i < 2; i++) {
    (function(idx){
      var ctrl = renderer.xr.getController(idx);
      ctrl.addEventListener('connected', function(e){ ctrl.userData.inputSource = e.data; });
      ctrl.addEventListener('selectstart', function(){
        resumeAudio();
        var src = ctrl.userData.inputSource;
        var ray = ctrlRay(ctrl);
        var p = pickPanel(ray.origin, ray.dir, 'vr');
        if (p && p.button) { fireButton(p.button.id, 'vr'); return; }
        var w = pickWorld(ray.origin, ray.dir, 'vr');
        if (w) { w.item.onPick(w); return; }
        DEMO.onEmptyClick && DEMO.onEmptyClick(ray, src);
      });
      ctrl.addEventListener('squeezestart', function(){
        var src = ctrl.userData.inputSource;
        DEMO.onSqueeze && DEMO.onSqueeze(ctrlRay(ctrl), src, ctrl);
      });
      ctrl.addEventListener('squeezeend', function(){
        var src = ctrl.userData.inputSource;
        DEMO.onSqueezeEnd && DEMO.onSqueezeEnd(ctrl, src);
      });
      var ray = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]),
        new THREE.LineBasicMaterial({ color: 0x66aaff, transparent: true, opacity: 0.75 })
      );
      ray.scale.z = 6; ray.name = 'ctrlRay' + idx;
      ctrl.add(ray);
      scene.add(ctrl);
      vrCtrls.push(ctrl); vrRays.push(ray);
    })(i);
  }
  if (navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported('immersive-vr').then(function(ok){
      var btn = $('enterVR');
      btn.style.display = 'block';
      S.hasEnter = true;                       // 进入路径已接好
      if (ok) {
        btn.disabled = false;
        btn.onclick = enterVR;
        $('vrhint').style.display = 'block';
        $('vrhint').innerHTML = '本机支持 immersive-vr。<br>戴上头显后点此进入，或直接用头显浏览器打开本页。';
      } else {
        btn.disabled = true; btn.textContent = '本机不支持沉浸式 VR';
        $('vrhint').style.display = 'block';
        $('vrhint').innerHTML = 'PC 可用鼠标键盘完成全部演示；<br>头显浏览器打开本页即可进入 VR。';
      }
      refreshGates();
    }).catch(function(e){
      $('enterVR').style.display = 'block';
      $('enterVR').disabled = true;
      $('enterVR').textContent = 'WebXR 检测失败';
      S.hasEnter = true;
      refreshGates();
      console.warn('isSessionSupported 失败', e);
    });
  } else {
    $('enterVR').style.display = 'block';
    $('enterVR').disabled = true;
    $('enterVR').textContent = '非安全上下文或无 WebXR';
    S.hasEnter = true;                       // 进入按钮与 enterVR() 都存在，只是本机硬件不支持
    S.hasExit = true;
    refreshGates();
  }
  /* 退出路径：会话 end 回调 + 侧栏「退出 VR」按钮 */
  S.hasExit = true;
  var ex = $('exitVR');
  if (ex) ex.onclick = function(){
    if (xrSession) xrSession.end().catch(function(e){ console.warn('结束 VR 会话失败', e); });
  };
  renderer.xr.addEventListener('sessionstart', function(){
    document.body.classList.add('XR');
  });
  renderer.xr.addEventListener('sessionend', function(){
    document.body.classList.remove('XR');
    xrSession = null;
  });
  refreshGates();
}
function ctrlRay(ctrl){
  var origin = new THREE.Vector3(), dir = new THREE.Vector3();
  ctrl.getWorldPosition(origin);
  dir.set(0, 0, -1).transformDirection(ctrl.matrixWorld);
  return { origin: origin, dir: dir };
}
function ctrlOfSource(src){
  for (var i = 0; i < vrCtrls.length; i++) if (vrCtrls[i].userData.inputSource === src) return vrCtrls[i];
  return vrCtrls[1] || vrCtrls[0] || null;
}
function enterVR(){
  resumeAudio();
  navigator.xr.requestSession('immersive-vr', {
    optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'layers']
  }).then(function(session){
    xrSession = session;
    renderer.xr.setSession(session);
    document.body.classList.add('XR');
    session.addEventListener('end', function(){
      xrSession = null;
      document.body.classList.remove('XR');
    });
  }).catch(function(e){
    console.warn('进入 VR 失败', e);
    toast('进入 VR 失败：' + (e && e.message ? e.message : e));
  });
}

/* -------- 1.7 主循环 -------- */
function onResize(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
function animate(){
  var dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt; frames++;
  fpsT += dt;
  if (fpsT >= 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; updateStats(); }

  if (!renderer.xr.isPresenting) {
    var sp = (keys.ShiftLeft || keys.ShiftRight) ? 3.2 : 1.7;
    var fwd = new THREE.Vector3(-Math.sin(player.rotation.y), 0, -Math.cos(player.rotation.y));
    var right = new THREE.Vector3(Math.cos(player.rotation.y), 0, -Math.sin(player.rotation.y));
    var mv = new THREE.Vector3();
    if (keys.KeyW || keys.ArrowUp) mv.add(fwd);
    if (keys.KeyS || keys.ArrowDown) mv.sub(fwd);
    if (keys.KeyD || keys.ArrowRight) mv.add(right);
    if (keys.KeyA || keys.ArrowLeft) mv.sub(right);
    if (mv.lengthSq() > 0) {
      mv.normalize().multiplyScalar(sp * dt);
      movePlayer(mv.x, mv.z);
    }
  }

  if (renderer.xr.isPresenting) readVRStick(dt);

  updateHover();

  DEMO.update(dt);
  if (panelDirty) redrawPanel();

  renderer.render(scene, camera);
  if (frames === 1 || frames % 15 === 0) updateStats();   // HUD 约 4 Hz 刷新（截图只跑几帧也能看到最新状态）
}
function movePlayer(dx, dz){
  var lim = ROOM.half - 0.45;
  player.position.x = clamp(player.position.x + dx, -lim, lim);
  player.position.z = clamp(player.position.z + dz, -lim, lim);
}
var snapCd = 0;
function readVRStick(dt){
  snapCd = Math.max(0, snapCd - dt);
  var src = xrSession && xrSession.inputSources;
  if (!src) return;
  for (var i = 0; i < src.length; i++) {
    var gp = src[i].gamepad;
    if (!gp || !gp.axes || gp.axes.length < 4) continue;
    if (Math.abs(gp.axes[2]) > 0.75 && snapCd <= 0) {
      player.rotation.y -= (gp.axes[2] > 0 ? -1 : 1) * Math.PI / 4;
      snapCd = 0.38;
    }
  }
}
function updateHover(){
  var r;
  if (renderer.xr.isPresenting) {
    if (!vrCtrls[0]) return;
    r = ctrlRay(vrCtrls[0]);
  } else {
    r = pcRay();
  }
  var p = pickPanel(r.origin, r.dir, 'hover');
  var id = p && p.button ? p.button.id : null;
  if (id !== hoverId) {
    hoverId = id;
    panelDirty = true;
    if (id) { pulse(null, 0.2, 30); beep(880, 35, 'sine', 0.035); }
  }
}
function updateStats(){
  if (!panel) return;
  var st = 'FPS ' + fps.toFixed(0) + ' · DrawCalls ' + renderer.info.render.calls +
           ' · Tris ' + renderer.info.render.triangles + '\n';
  var lines = CFG.hudLines ? CFG.hudLines() : [];
  for (var i = 0; i < lines.length; i++) st += lines[i] + '\n';
  $('stats').textContent = st;
}

/* ======================= 2. 场景基础（6×6 m 房间） ======================= */
function makeTex(w, h, fn, rx, ry){
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var g = c.getContext('2d'); fn(g, w, h);
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(rx || 1, ry || 1);
  t.anisotropy = 4;
  return t;
}
function texFloor(){
  return makeTex(256, 256, function(g, w, h){
    g.fillStyle = '#3c4757'; g.fillRect(0, 0, w, h);
    for (var y = 0; y < h; y += 64) for (var x = 0; x < w; x += 64) {
      var v = 0.88 + Math.random() * 0.22;
      g.fillStyle = 'rgb(' + (64 * v | 0) + ',' + (74 * v | 0) + ',' + (88 * v | 0) + ')';
      g.fillRect(x + 2, y + 2, 60, 60);
    }
    g.strokeStyle = 'rgba(20,26,36,.5)'; g.lineWidth = 3;
    for (var i = 0; i <= 256; i += 64) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke();
      g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke();
    }
  }, 4, 4);
}
function texWall(){
  return makeTex(128, 128, function(g, w, h){
    g.fillStyle = '#6f7d92'; g.fillRect(0, 0, w, h);
    for (var k = 0; k < 500; k++) {
      g.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.05) + ')';
      g.fillRect(Math.random() * w, Math.random() * h, 2, 2);
    }
    g.fillStyle = 'rgba(30,38,50,.2)'; g.fillRect(0, h - 8, w, 8);
  }, 6, 2);
}

/* 解算一条"高弧线"把球送进篮子（样板用辅助瞄准，保证计数可复现） */
function throwBall(b){
  if (!b || S.heldBall === b) { if (S.heldBall) { b = S.heldBall; } }
  if (!b) return false;
  if (b.held) { b.held = false; b.holder = null; }
  var from = b.mesh.position.clone();
  var dx = BASKET.x - from.x, dz = BASKET.z - from.z;
  var d = Math.hypot(dx, dz), hgt = BASKET.y - from.y;
  var g = G, v = 4.8;
  var v2 = v * v;
  var disc = v2 * v2 - g * (g * d * d + 2 * hgt * v2);
  var elev;
  if (d < 0.25) { elev = Math.PI / 2; }
  else if (disc < 0) { elev = Math.PI / 4; }
  else { elev = Math.atan((v2 + Math.sqrt(disc)) / (g * d)); }   // 高弧线解
  var dirH = new THREE.Vector3(dx, 0, dz);
  if (dirH.lengthSq() < 1e-6) dirH.set(0, 0, -1);
  dirH.normalize();
  b.vel.set(dirH.x * Math.cos(elev) * v, Math.sin(elev) * v, dirH.z * Math.cos(elev) * v);
  b.done = false; b.scored = 0; b.rest = 0;
  S.ballsThrown++;
  S.lastAction = '投出球 ' + (b.idx + 1);
  beep(660, 55, 'triangle', 0.045);
  pulse(null, 0.3, 30);
  markFired('ball');
  panelDirty = true; refreshHUDOnly();
  return true;
}

}

/* ---------- 3.5 球物理 ---------- */
function stepBallPhysics(dt){
  var n = Math.max(1, Math.min(8, Math.ceil(dt / 0.016)));
  var h = dt / n;
  for (var s = 0; s < n; s++) {
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      if (b.held) continue;
      /* 刚进筐的球：先停在篮口 2.5 s（看得见），再回收 */
      if (b.park > 0) {
        b.park += h;
        if (b.park > 2.5) { b.park = 0; returnBallHome(b); }
        continue;
      }
      var p = b.mesh.position;
      if (b.done && b.mesh.position.distanceTo(b.home) < 0.002) continue;
      b.vel.y -= G * h;
      p.addScaledVector(b.vel, h);
      if (!b.done) {
        var hd = Math.hypot(p.x - BASKET.x, p.z - BASKET.z);
        if (b.vel.y < 0 && Math.abs(p.y - BASKET.y) < 0.12 && hd < BASKET.r - BALL_R) {
          b.done = true;
          p.set(BASKET.x, BASKET.y - 0.05, BASKET.z);
          b.vel.set(0, 0, 0);
          b.park = 0.001;
          onBasket();
          continue;
        }
        /* 篮口擦筐：弹开一点，别穿过筐壁 */
        if (!b.done && b.vel.y < 0 && Math.abs(p.y - BASKET.y) < 0.12 &&
            hd >= BASKET.r - BALL_R && hd < BASKET.r + BALL_R) {
          var nx = (p.x - BASKET.x) / (hd || 1), nz = (p.z - BASKET.z) / (hd || 1);
          b.vel.x = nx * 1.1; b.vel.z = nz * 1.1; b.vel.y = 0.9;
        }
      }
      if (p.y < BALL_R) {
        p.y = BALL_R;
        if (Math.abs(b.vel.y) > 0.4) { b.vel.y = -b.vel.y * 0.5; b.vel.x *= 0.8; b.vel.z *= 0.8; }
        else { b.vel.y = 0; b.vel.x *= 0.85; b.vel.z *= 0.85; }
        if (Math.abs(b.vel.x) + Math.abs(b.vel.z) < 0.12) { b.vel.x = 0; b.vel.z = 0; }
      }
      /* 房间边界 */
      var lim = ROOM.half - BALL_R;
      if (p.x < -lim) { p.x = -lim; b.vel.x = Math.abs(b.vel.x) * 0.4; }
      if (p.x > lim) { p.x = lim; b.vel.x = -Math.abs(b.vel.x) * 0.4; }
      if (p.z < -lim) { p.z = -lim; b.vel.z = Math.abs(b.vel.z) * 0.4; }
      if (p.z > lim) { p.z = lim; b.vel.z = -Math.abs(b.vel.z) * 0.4; }
      /* 静止 → 回托盘 */
      if (p.y <= BALL_R + 0.02 && b.vel.lengthSq() < 0.02) {
        b.rest += h;
        if (b.rest > 1.2) returnBallHome(b);
      } else b.rest = 0;
      if (b.done && b.rest > 1.2) returnBallHome(b);
    }
  }
}
function returnBallHome(b){
  b.mesh.position.copy(b.home);
  b.vel.set(0, 0, 0);
  b.held = false; b.holder = null; b.done = true; b.rest = 0; b.scored = 0; b.park = 0;
  if (S.heldBall === b) S.heldBall = null;
}

function refreshGates(){
  var g1 = !!(S.hasEnter && S.hasExit);
  var usable = INTERACTIONS.filter(function(x){ return x.pc === true || x.vr === true || x.vr === 'cond'; }).length;
  var g2 = usable >= 3;
  var g3 = errCount === 0;
  S.gates = { enter: g1, count: g2, noerr: g3 };
  var ul = $('gateList');
  if (!ul) return;
  function li(ok, txt){
    return '<li><span class="' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✔' : '✘') + '</span> ' + txt + '</li>';
  }
  ul.innerHTML =
    li(g1, '能进能退（进入/退出路径已接，真机进出一节需实测）') +
    li(g2, '≥3 种交互可用（当前 ' + usable + ' 种）') +
    li(g3, '控制台无报错（window error 计数 ' + errCount + '）');
}

    if (ball) { grabBall(ball, 'vr'); S.heldBall.holder = ctrl || heldAnchor; return; }
  },
  onSqueezeEnd: function(ctrl, src){
    if (S.lampHeld) {
      /* 靠近展示台 → 自动吸附 */
      var d = lampGroup.position.distanceTo(new THREE.Vector3(0.55, pedestalTopY, -2.3));
      if (d < 0.6) placeLamp();
      else { toast('把台灯拿到绿色展示台旁边再松手'); }
      return;
    }
    if (S.heldBall) throwBall(S.heldBall);
  },
  update: function(dt){
    if (!DEMO_READY) return;
    if (S.lampHeld && lampGroup) {
      var lh = S.lampHolder || heldAnchor;
      if (lh) {
        lh.updateMatrixWorld();
        tmpV.set(0, 0.12, 0).applyMatrix4(lh.matrixWorld);
        lampGroup.position.lerp(tmpV, Math.min(1, dt * 12));
      }
    }
    if (S.heldBall && S.heldBall.holder) {
      var h = S.heldBall.holder;
      h.updateMatrixWorld();
      tmpV.set(0, 0, 0).applyMatrix4(h.matrixWorld);
      S.heldBall.mesh.position.lerp(tmpV, Math.min(1, dt * 18));
    }
    stepBallPhysics(dt);
    /* 篮筐闪光衰减 */
    if (basketRim && basketRim.material.emissiveIntensity > 0.6) {
      basketRim.material.emissiveIntensity = Math.max(0.6, basketRim.material.emissiveIntensity - dt * 4);
    }
    if (pedestalRing) pedestalRing.rotation.z += dt * 1.4;
    /* 注释高亮轻微呼吸 */
    if (outlinesGroup && outlinesGroup.visible) {
      for (var i = 0; i < outlinesGroup.children.length; i++) {
        outlinesGroup.children[i].material.opacity = 0.55 + 0.4 * Math.sin(elapsed * 3 + i);
      }
    }
    for (var j = popups.length - 1; j >= 0; j--) {
      var pp = popups[j];
      pp.t += dt;
      pp.sp.position.y += dt * 0.5;
      pp.sp.material.opacity = Math.max(0, 1 - pp.t / pp.life);
      if (pp.t > pp.life) {
        scene.remove(pp.sp);
        pp.sp.material.map.dispose();
        pp.sp.material.dispose();
        popups.splice(j, 1);
      }
    }
  },
  reset: function(){
    S.colorIdx = 0; S.level = 1; S.comment = false;
    S.triggered = 0; S.basket = 0; S.ballsThrown = 0;
    S.lampHeld = false; S.lampPlaced = false; S.lampHolder = null;
    for (var i = 0; i < INTERACTIONS.length; i++) INTERACTIONS[i].fired = false;
    if (labelsGroup) labelsGroup.visible = false;
    if (outlinesGroup) outlinesGroup.visible = false;
    if (lampOutline) lampOutline.visible = false;
    if (lampGroup) lampGroup.position.copy(lampHome);
    releaseBall();
    for (var k = 0; k < balls.length; k++) returnBallHome(balls[k]);
    if (pedestalRing) pedestalRing.material.color.setHex(0x7ef7c1);
    if (basketRim) basketRim.material.emissiveIntensity = 0.6;
    if (player) { player.position.set(0, 0, 1.6); player.rotation.y = 0; }
    if (camera) camera.rotation.x = 0;
    hapticLog.length = 0; sfxLog.length = 0;
    applyLight();
    renderSidebar();
    panelDirty = true;
    toast('已重置：灯光 / 台灯 / 3 个球 / 计数 / 注释');
  },
  selfTest: function(){
    var pass = [], fail = [], T = function(ok, name){ (ok ? pass : fail).push(name); };
    DEMO.reset();

    /* ① 三项交互注册 */
    T(INTERACTIONS.length === 3, '交互注册表 = 3 项');
    T(INTERACTIONS.every(function(x){ return typeof x.trigger === 'string' && x.trigger.length > 6; }),
      '每项交互都写了「触发」说明');
    T(!!panel && panelBtns.length >= 5, '3D 控制面板按钮 ≥5');
    T(renderer.info.render.calls > 0, 'animate 已渲染（CALLS>0）');

    /* ② 《交互清单》自动生成：含三项名称 + PC/VR 两列 */
    var tbTxt = $('invBody') ? $('invBody').textContent : '';
    T(tbTxt.indexOf('灯光面板') >= 0 && tbTxt.indexOf('抓取台灯') >= 0 && tbTxt.indexOf('投球入篮') >= 0,
      '清单文本含三项交互名');
    var hasPC = false, hasVR = false;
    for (var i = 0; i < INTERACTIONS.length; i++) {
      if (INTERACTIONS[i].pc === true) hasPC = true;
      if (INTERACTIONS[i].vr === true || INTERACTIONS[i].vr === 'cond') hasVR = true;
    }
    T(hasPC && hasVR, '清单同时给出 PC / VR 两列可达性');

    /* ③ 三条达标线 */
    refreshGates();
    T(S.gates.enter && S.gates.count && S.gates.noerr, '三条达标线全部通过（能进能退 / 不少于 3 种交互 / 无报错）');
    T(errCount === 0, '页面运行至今 window error 计数 = 0');

    /* ④ 交互一：灯光按钮改变灯光 */
    var c0 = roomLight.color.getHex(), i0 = roomLight.intensity;
    DEMO.onPick('color');
    T(roomLight.color.getHex() !== c0, '灯光按钮改变房间灯光颜色');
    DEMO.onPick('down');
    T(roomLight.intensity !== i0, '亮度按钮改变灯光强度');
    T(INTERACTIONS[0].fired, '① 交互已标记为「已触发」');

    /* ⑤ 交互二：抓台灯 → 放到展示台 */
    var okPick = pickLamp();
    T(okPick && S.lampHeld, '点击台灯可以抓起（lampHeld=true）');
    var sfx0 = sfxLog.length, hz0 = hapticLog.length;
    var okPlace = placeLamp();
    T(okPlace && S.lampPlaced, '台灯放到展示台（lampPlaced=true）');
    T(lampGroup.position.distanceTo(new THREE.Vector3(0.55, pedestalTopY, -2.3)) < 0.01,
      '台灯吸附到展示台坐标');
    T(sfxLog.length > sfx0 && hapticLog.length > hz0, '到位有音效 + 震动反馈');

    /* ⑥ 交互三：投球入篮 → 计数 +1 */
    var b0 = S.basket;
    var okThrow = throwBall(balls[0]);
    T(okThrow, '投球动作已触发');
    for (var s = 0; s < 200; s++) stepBallPhysics(0.016);   // 推进 3.2 s 物理
    T(S.basket === b0 + 1, '投球入篮计数 +1（物理判定链路）');

    /* ⑦ 注释模式 */
    var v0 = labelsGroup.visible;
    DEMO.setComment(true);
    T(labelsGroup.visible === true && v0 === false, '注释模式开启后 3D 标注可见');
    T(outlinesGroup.visible === true, '注释模式开启后目标物体高亮可见');
    DEMO.setComment(false);
    T(labelsGroup.visible === false, '注释模式关闭后标注隐藏');

    /* ⑧ 重置 */
    DEMO.reset();
    T(S.basket === 0 && S.level === 1 && S.colorIdx === 0 && !S.lampPlaced,
      'reset 复位灯光 / 台灯 / 计数 / 注释');
    T(lampGroup.position.distanceTo(lampHome) < 0.01, 'reset 后台灯回到桌上');

    /* ⑨ 面板 UV 命中 */
    var bn = panelBtns[0];
    var uv0 = { x: (bn.x + bn.w / 2) / panelCanvas.width, y: 1 - (bn.y + bn.h / 2) / panelCanvas.height };
    T(uiHitUV(uv0) === bn, 'UV 命中函数可用（面板按钮可点）');
    T(uiHitUV({ x: 0.002, y: 0.002 }) === null, 'UV 空白处不误命中');

    DEMO.reset();
    return { pass: pass, fail: fail };
  }
};

/* ======================= 4. 启动 ======================= */
function boot(){
  renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e1220);
  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 60);
  camera.position.set(0, 1.6, 0);
  player = new THREE.Group();
  player.add(camera);
  player.position.set(0, 0, 1.6);
  scene.add(player);
  clock = new THREE.Clock();

  /* 控制台报错计数（用事件监听，不覆盖验证脚本注入的 window.onerror） */
  window.addEventListener('error', function(e){
    errCount++;
    errSeen.push(String(e.message || e.type));
    refreshGates();
  });
  window.addEventListener('unhandledrejection', function(e){
    errCount++;
    errSeen.push('REJECT ' + e.reason);
    refreshGates();
  });

  DEMO.buildWorld();
  DEMO.buildUI();
  setupVR();
  setupPC();
  document.title = CFG.id.toUpperCase() + ' · ' + CFG.title;
  $('hudTitle').textContent = CFG.title;
  $('hudTag').textContent = CFG.subtitle;
  $('loadTitle').textContent = CFG.title;
  $('hudPC').innerHTML = '<b>PC 操作</b><br>' + CFG.pcKeys;
  $('hudVR').innerHTML = '<b>头显操作</b><br>' + CFG.vrKeys;
  $('hudTeach').innerHTML = '<b>课堂要点</b><br>' + CFG.teach;
  redrawPanel();

  window.LAB = {
    S: S, scene: scene, camera: camera, renderer: renderer, player: player, cfg: CFG,
    roomLight: roomLight, lamp: function(){ return lampGroup; }, balls: balls,
    interactions: INTERACTIONS,
    ui: { panel: function(){ return panel; }, buttons: function(){ return panelBtns; },
          hover: function(){ return hoverId; },
          labels: function(){ return labelsGroup; }, outlines: function(){ return outlinesGroup; } },
    api: {
      comment: function(on){ DEMO.setComment(on); return S.comment; },
      light: function(action){
        if (action === 'cycle') DEMO.onPick('color');
        else if (action === 'up') DEMO.onPick('up');
        else if (action === 'down') DEMO.onPick('down');
        return { color: roomLight.color.getHex(), intensity: roomLight.intensity, level: S.level };
      },
      pickLamp: pickLamp,
      placeLamp: placeLamp,
      throwBall: function(i){ return throwBall(balls[i || 0]); },
      step: function(sec){ for (var i = 0, n = Math.round(sec / 0.016); i < n; i++) stepBallPhysics(0.016); return S.basket; },
      reset: DEMO.reset,
      sidebar: function(){ return $('invBody') ? $('invBody').textContent : ''; },
      clearFx: function(){
        for (var i = popups.length - 1; i >= 0; i--) {
          scene.remove(popups[i].sp);
          popups[i].sp.material.map.dispose();
          popups[i].sp.material.dispose();
        }
        popups.length = 0;
      },
      gates: function(){ refreshGates(); return { gates: JSON.parse(JSON.stringify(S.gates)),
        errCount: errCount, errors: errSeen.slice() }; },
      getState: function(){ return JSON.parse(JSON.stringify(S)); },
      setState: function(k, v){ S[k] = v; panelDirty = true; },
      haptics: function(){ return hapticLog.slice(); },
      sfx: function(){ return sfxLog.slice(); },
      selfTest: function(){
        var r = DEMO.selfTest();
        console.log('SELFTEST PASS ' + r.pass.length + ' / FAIL ' + r.fail.length);
        if (r.fail.length) console.log('SELFTEST FAILED: ' + r.fail.join(' | '));
        return r;
      }
    }
  };

  var loader = $('loader');
  $('loadMsg').textContent = '就绪 · ' + CFG.part;
  setTimeout(function(){ loader.style.opacity = '0'; setTimeout(function(){ loader.remove(); }, 520); }, 180);

  onResize();
  renderer.setAnimationLoop(animate);
}
try { boot(); }
catch (e) {
  console.error('启动失败', e);
  var lm = document.getElementById('loadMsg');
  if (lm) lm.textContent = '启动失败：' + e.message;
}
})();
</script>
</body>
