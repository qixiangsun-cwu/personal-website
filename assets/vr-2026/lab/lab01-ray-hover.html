<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>A1 射线 · 悬停 · 三通道反馈</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#0e1220;color:#e8eefc;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;}
  #c{position:fixed;inset:0;display:block;}
  #hud{position:fixed;left:14px;top:14px;z-index:20;width:288px;padding:12px 14px;
    background:rgba(15,20,34,.9);border:1px solid #2b3854;border-radius:10px;
    font-size:12px;line-height:1.65;box-shadow:0 8px 26px rgba(0,0,0,.4);}
  #hud h2{margin:0 0 4px;font-size:15px;color:#7fc4ff;letter-spacing:.5px;}
  #hud .tagline{color:#93a4c2;font-size:11px;margin-bottom:6px;}
  #hud .sec{border-top:1px solid #253149;margin-top:8px;padding-top:7px;}
  #hud b{color:#9fd0ff;font-weight:600;}
  #hud .k{display:inline-block;background:#1b2540;border:1px solid #31405f;border-radius:4px;
    padding:0 5px;margin:1px 2px;color:#cfe2ff;font-size:11px;}
  #hud .warnline{color:#ffc857;}
  #stats{color:#5fd08a;font-size:11px;white-space:pre-line;}
  #enterVR{position:fixed;right:18px;top:18px;z-index:20;display:none;cursor:pointer;
    background:linear-gradient(135deg,#2f7de1,#1b4fa8);color:#fff;border:none;border-radius:24px;
    padding:11px 22px;font-size:15px;letter-spacing:2px;box-shadow:0 4px 16px rgba(47,125,225,.4);}
  #enterVR:disabled{background:#4a5468;cursor:not-allowed;box-shadow:none;}
  #vrhint{position:fixed;right:18px;top:72px;z-index:20;max-width:236px;display:none;
    background:rgba(15,20,34,.88);border:1px solid #2b3854;border-radius:8px;padding:7px 9px;
    color:#b9c8e2;font-size:11px;line-height:1.6;text-align:right;}
  #toast{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:25;
    background:rgba(21,28,46,.95);border:1px solid #3a4a6c;border-radius:10px;padding:10px 18px;
    font-size:14px;color:#d9e6ff;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;}
  #toast.show{opacity:1;}
  #loader{position:fixed;inset:0;z-index:50;background:#0e1220;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:6px;transition:opacity .5s;}
  #loader h1{font-size:26px;letter-spacing:4px;color:#7fc4ff;margin:0;font-weight:600;}
  #loader p{font-size:13px;color:#8fa2c2;margin:0;}
  body.XR #hud,body.XR #enterVR,body.XR #vrhint{display:none!important;}
  body.XR #toast{bottom:auto;top:24px;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <h2 id="hudTitle">LAB</h2>
  <div class="tagline" id="hudTag"></div>
  <div class="sec" id="hudPC"></div>
  <div class="sec" id="hudVR"></div>
  <div class="sec" id="hudTeach"></div>
  <div class="sec"><span id="stats">初始化…</span></div>
</div>
<div id="toast"></div>
<button id="enterVR">进入 VR</button>
<div id="vrhint"></div>
<div id="loader">
  <h1 id="loadTitle">LAB</h1>
  <p id="loadMsg">正在初始化…</p>
</div>

<script src="./three.min.js"></script>
<script>
/* =========================================================================
 * 第 7 次课 · WebXR 交互零件演示脚手架（模板）
 * 用法：复制本文件 → 改 CFG → 在 DEMO 区实现 buildWorld / buildUI / update / onPick /
 *       selfTest / reset。基础设施区（0—4 段）不要改。
 * 约定（验证工具依赖，务必保留）：
 *   1. 外部库用「点斜杠」相对路径引入 three.min.js（与页面同目录）
 *   2. 必须存在行 `  renderer.setAnimationLoop(animate);`
 *   3. animate() 内必须调用 renderer.render(scene, camera)
 *   4. renderer.xr.setReferenceSpaceType('local-floor') 在会话创建前调用
 *   5. 暴露 window.LAB = {S, scene, camera, renderer, player, api}
 * ========================================================================= */
(function(){
'use strict';

/* ======================= 0. 演示配置（每个演示改这一段） ======================= */
var CFG = {
  id: 'lab01',
  title: 'A1 射线 · 悬停 · 三通道反馈',
  subtitle: '单级 Midas 触摸 vs 两级确认 · 对应练习 E1',
  part: '组 A / 交互零件 A1 + A4',
  aimMode: 'mouse',          // 鼠标位置拾取（无鼠标事件时退回屏幕中心）
  pcKeys: '移动鼠标=射线 · 左键=确认 · W/A/S/D=走近 · M=切换单级/两级 · E=声音开关 · C=误触清零 · R=重置',
  vrKeys: '扳机=确认（两级模式）· 射线扫过靶球=自动触发（单级模式）· 右摇杆左右=转 45°（手柄触觉/扳机未在真机验证）',
  teach: '一次有效交互 = 视觉 + 听觉 + 触觉至少两通道；悬停 ≠ 确认。单级 Midas 触摸把"路过"当成"按下"，所以要加第二级确认。',
  hudLines: function(){
    var m = (S.mode === 'single') ? '单级 Midas（悬停即触发）' : '两级确认（推荐）';
    return [
      '模式：' + m + ' · 声音' + (S.sound ? '开' : '关'),
      '本次通道：视' + (S.ch.v ? '●' : '○') + ' 听' + (S.ch.a ? '●' : '○') + ' 触' + (S.ch.h ? '●' : '○') + ' = ' + S.lastCh + '/3',
      '悬停 ' + S.hoverCount + ' · 确认 ' + S.confirmCount + ' · 误触 ' + S.misTouch,
      '上次：' + S.lastAction
    ];
  }
};

/* ======================= 1. 基础设施（不要改） ======================= */
var renderer, scene, camera, player, clock, audioCtx = null;
var raycaster = new THREE.Raycaster();
var aimNdc = new THREE.Vector2(0, 0);
var tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();
var panel = null, panelCanvas = null, panelCtx = null, panelTex = null;
var panelBtns = [], hoverId = null, panelDirty = true;
var uiHits = [], pickables = [];        // pickables: {mesh, id, onPick}
var hapticLog = [], sfxLog = [];
var keys = {}, dragging = false, lastMouse = {x:0,y:0}, dragDist = 0;
var vrCtrls = [], vrRays = [], xrSession = null;
var elapsed = 0, frames = 0, fps = 60, fpsT = 0;

/* -------- 1.1 状态：演示自己的状态全部挂在这里 -------- */
var S = {
  mode: 'two',             // 'single' 单级 Midas 触摸 | 'two' 两级确认
  sound: true,             // 声音开关
  mute: false,             // 与 sound 反向（基础设施的 beep() 读 S.mute）
  hoverTarget: null,       // 当前悬停的靶球 id
  pinHover: null,          // 截图/无头演示用：锁定悬停目标（api.hover 设置）
  hoverCount: 0,           // 悬停进入次数
  confirmCount: 0,         // 两级确认次数
  misTouch: 0,             // 单级 Midas 误触次数
  ch: { v: false, a: false, h: false },   // 本次交互三通道：视/听/触
  lastCh: 0,               // 本次通道数 0—3
  pulse: 0,                // 视觉脉冲能量 0—1
  lastAction: '—',
  lastPick: '—',           // 基础设施 fireButton 写入
  picks: 0                 // 基础设施 fireButton 写入
};

/* 三颗靶球：世界坐标（距玩家 4.4—4.9 m，高 2.05—2.50 m，位于面板上方） */
var TGTS = [
  { id: 't1', name: '靶球 A', x: -2.30, y: 2.05, z: -4.40, color: 0xff9a3c },
  { id: 't2', name: '靶球 B', x:  0.00, y: 2.50, z: -4.90, color: 0x62d9ff },
  { id: 't3', name: '靶球 C', x:  2.30, y: 2.05, z: -4.40, color: 0x9be36a }
];
var tgt = {};             // id -> {group, ball, ring, t, flash}
var _keyCd = {};          // 键盘防重复触发（keydown 会自动重复）

/* -------- 1.2 小工具 -------- */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function fmt(v, n){ return (isFinite(v) ? v.toFixed(n == null ? 2 : n) : '—'); }
function $(id){ return document.getElementById(id); }
function toast(msg, ms){
  var t = $('toast');
  if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, ms || 1600);
}
function initAudio(){
  if (audioCtx) return audioCtx;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  } catch (e) { console.warn('AudioContext 不可用', e); }
  return audioCtx;
}
function resumeAudio(){
  var c = initAudio();
  if (c && c.state === 'suspended') c.resume().catch(function(){});
}
/* 合成音：freq 频率 Hz，dur 毫秒，type 波形，gain 音量 */
function beep(freq, dur, type, gain){
  var c = initAudio();
  if (!c || S.mute) { sfxLog.push({t: elapsed, freq: freq, skipped: !c}); return; }
  try {
    if (c.state === 'suspended') c.resume().catch(function(){});
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.value = (gain == null ? 0.05 : gain);
    o.connect(g); g.connect(c.destination);
    var now = c.currentTime, d = (dur || 60) / 1000;
    g.gain.setValueAtTime(g.gain.value, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + d);
    o.start(now); o.stop(now + d + 0.01);
    sfxLog.push({t: elapsed, freq: freq, dur: dur || 60});
  } catch (e) { console.warn('beep 失败', e); }
}
/* 触觉：inputSource 可为 null（PC 模拟时只记日志） */
function pulse(src, intensity, ms){
  hapticLog.push({t: elapsed, intensity: intensity, ms: ms, real: !!(src && src.gamepad &&
    src.gamepad.hapticActuators && src.gamepad.hapticActuators[0])});
  try {
    var acts = src && src.gamepad && src.gamepad.hapticActuators;
    if (acts && acts[0] && acts[0].pulse) acts[0].pulse(intensity, ms);
    else if (src && src.gamepad && src.gamepad.hapticActuators && src.gamepad.hapticActuators[0] &&
             src.gamepad.hapticActuators[0].pulse) src.gamepad.hapticActuators[0].pulse(intensity, ms);
  } catch (e) { console.warn('触觉不可用', e); }
}

/* -------- 1.3 3D 面板（CanvasTexture + UV 命中） -------- */
/* mkPanel(width_m, height_m, pxW, pxH) 返回 mesh；全局 panel 指向它 */
function mkPanel(wM, hM, pxW, pxH){
  panelCanvas = document.createElement('canvas');
  panelCanvas.width = pxW; panelCanvas.height = pxH;
  panelCtx = panelCanvas.getContext('2d');
  panelTex = new THREE.CanvasTexture(panelCanvas);
  panelTex.minFilter = THREE.LinearFilter;
  var mat = new THREE.MeshBasicMaterial({ map: panelTex, transparent: true });
  panel = new THREE.Mesh(new THREE.PlaneGeometry(wM, hM), mat);
  panel.name = 'uiPanel';
  panelBtns = [];
  return panel;
}
/* 注册按钮：px 坐标以面板 canvas 像素为准（左上角原点） */
function uiButton(id, label, px, py, pw, ph, enabled){
  panelBtns.push({ id: id, label: label, x: px, y: py, w: pw, h: ph, enabled: enabled !== false });
}
/* 面板绘制：DEMO.drawUI(ctx, W, H) 负责画背景与文字，按钮由 drawButtons 统一画 */
function drawButtons(ctx, W, H){
  for (var i = 0; i < panelBtns.length; i++) {
    var b = panelBtns[i], on = (hoverId === b.id);
    ctx.fillStyle = !b.enabled ? '#2a3346' : (on ? '#3f8ae0' : '#24314c');
    ctx.strokeStyle = on ? '#9fd0ff' : '#3a4a6c';
    ctx.lineWidth = on ? 3 : 2;
    roundRect(ctx, b.x, b.y, b.w, b.h, 10);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = !b.enabled ? '#6b7688' : (on ? '#ffffff' : '#d5e3f8');
    ctx.font = 'bold 26px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2);
  }
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function redrawPanel(){
  if (!panelCtx) return;
  var W = panelCanvas.width, H = panelCanvas.height;
  panelCtx.clearRect(0, 0, W, H);
  DEMO.drawUI(panelCtx, W, H);
  drawButtons(panelCtx, W, H);
  panelTex.needsUpdate = true;
  panelDirty = false;
}
/* UV → 按钮 id */
function uiHitUV(uv){
  if (!uv) return null;
  var px = uv.x * panelCanvas.width, py = (1 - uv.y) * panelCanvas.height;
  for (var i = 0; i < panelBtns.length; i++) {
    var b = panelBtns[i];
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return b;
  }
  return null;
}

/* -------- 1.4 拾取（PC / VR 共用） -------- */
/* 返回 {hit, id, point, distance, uv, object} */
function castFrom(origin, dir, objs){
  raycaster.set(origin, dir.clone().normalize());
  raycaster.far = 30;
  var hits = raycaster.intersectObjects(objs, true);
  return hits && hits.length ? hits[0] : null;
}
function pickPanel(origin, dir, src){
  var h = castFrom(origin, dir, [panel]);
  if (!h) return null;
  var b = uiHitUV(h.uv);
  return { button: b, point: h.point, distance: h.distance, source: src };
}
function pickWorld(origin, dir, src){
  var list = pickables.map(function(p){ return p.mesh; });
  var h = castFrom(origin, dir, list);
  if (!h) return null;
  var obj = h.object, owner = null;
  while (obj && !owner) {
    for (var i = 0; i < pickables.length; i++) if (pickables[i].mesh === obj) owner = pickables[i];
    obj = obj.parent;
  }
  return owner ? { item: owner, point: h.point, distance: h.distance, source: src } : null;
}
function registerPick(mesh, id, onPick){
  pickables.push({ mesh: mesh, id: id, onPick: onPick || function(){} });
  return mesh;
}

/* -------- 1.5 PC 输入 -------- */
function setupPC(){
  var cvs = renderer.domElement;
  cvs.addEventListener('pointerdown', function(e){
    resumeAudio();
    dragging = true; dragDist = 0; lastMouse.x = e.clientX; lastMouse.y = e.clientY;
    cvs.setPointerCapture && cvs.setPointerCapture(e.pointerId);
  });
  cvs.addEventListener('pointermove', function(e){
    var dx = e.clientX - lastMouse.x, dy = e.clientY - lastMouse.y;
    lastMouse.x = e.clientX; lastMouse.y = e.clientY;
    if (dragging) {
      dragDist += Math.abs(dx) + Math.abs(dy);
      player.rotation.y -= dx * 0.0032;
      camera.rotation.x = clamp(camera.rotation.x - dy * 0.0032, -1.15, 1.0);
    } else {
      updateMouseAim(e);
    }
  });
  cvs.addEventListener('pointerup', function(e){
    if (dragging && dragDist < 6) { resumeAudio(); doClick(e); }
    dragging = false;
  });
  cvs.addEventListener('pointercancel', function(){ dragging = false; });
  window.addEventListener('keydown', function(e){
    keys[e.code] = true;
    if (e.code === 'KeyR') { DEMO.reset(); toast('已重置'); }
    else if (e.code === 'KeyT' && DEMO.onKey) DEMO.onKey('KeyT');
    else if (DEMO.onKey) DEMO.onKey(e.code);
  });
  window.addEventListener('keyup', function(e){ keys[e.code] = false; });
  window.addEventListener('resize', onResize);
}
function updateMouseAim(e){
  var r = renderer.domElement.getBoundingClientRect();
  aimNdc.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  aimNdc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}
function pcRay(){
  camera.getWorldPosition(tmpV);
  var dir = new THREE.Vector3();
  if (CFG.aimMode === 'center') {
    camera.getWorldDirection(dir);
  } else {
    dir.set(aimNdc.x, aimNdc.y, 0.5).unproject(camera).sub(tmpV).normalize();
  }
  return { origin: tmpV.clone(), dir: dir };
}
function doClick(e){
  var r = pcRay();
  var p = pickPanel(r.origin, r.dir, 'pc');
  if (p && p.button) { fireButton(p.button.id, 'pc'); return; }
  var w = pickWorld(r.origin, r.dir, 'pc');
  if (w) { w.item.onPick(w); return; }
  DEMO.onEmptyClick && DEMO.onEmptyClick(r);
}
function fireButton(id, src){
  for (var i = 0; i < panelBtns.length; i++) {
    if (panelBtns[i].id === id) {
      if (!panelBtns[i].enabled) return false;
      S.lastPick = id; S.picks++;
      pulse(null, 0.5, 60); beep(1046, 55, 'square', 0.05);
      DEMO.onPick(id, src);
      panelDirty = true;
      return true;
    }
  }
  return false;
}

/* -------- 1.6 VR 输入 -------- */
function setupVR(){
  for (var i = 0; i < 2; i++) {
    (function(idx){
      var ctrl = renderer.xr.getController(idx);
      ctrl.addEventListener('connected', function(e){ ctrl.userData.inputSource = e.data; });
      ctrl.addEventListener('selectstart', function(){
        resumeAudio();
        var src = ctrl.userData.inputSource;
        var ray = ctrlRay(ctrl);
        var p = pickPanel(ray.origin, ray.dir, 'vr');
        if (p && p.button) { fireButton(p.button.id, 'vr'); return; }
        var w = pickWorld(ray.origin, ray.dir, 'vr');
        if (w) { w.item.onPick(w); return; }
        DEMO.onEmptyClick && DEMO.onEmptyClick(ray, src);
      });
      ctrl.addEventListener('squeezestart', function(){
        var src = ctrl.userData.inputSource;
        DEMO.onSqueeze && DEMO.onSqueeze(ctrlRay(ctrl), src);
      });
      ctrl.addEventListener('squeezeend', function(){
        var src = ctrl.userData.inputSource;
        DEMO.onSqueezeEnd && DEMO.onSqueezeEnd(ctrl, src);
      });
      var ray = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-1)]),
        new THREE.LineBasicMaterial({ color: 0x66aaff, transparent: true, opacity: 0.75 })
      );
      ray.scale.z = 6; ray.name = 'ctrlRay' + idx;
      ctrl.add(ray);
      scene.add(ctrl);
      vrCtrls.push(ctrl); vrRays.push(ray);
    })(i);
  }
  if (navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported('immersive-vr').then(function(ok){
      var btn = $('enterVR');
      btn.style.display = 'block';
      if (ok) {
        btn.disabled = false;
        btn.onclick = enterVR;
        $('vrhint').style.display = 'block';
        $('vrhint').innerHTML = '本机支持 immersive-vr。<br>戴上头显后点此进入，或直接用头显浏览器打开本页。';
      } else {
        btn.disabled = true; btn.textContent = '本机不支持沉浸式 VR';
        $('vrhint').style.display = 'block';
        $('vrhint').innerHTML = 'PC 可用鼠标键盘完成全部演示；<br>头显浏览器打开本页即可进入 VR。';
      }
    }).catch(function(e){
      $('enterVR').style.display = 'block';
      $('enterVR').disabled = true;
      $('enterVR').textContent = 'WebXR 检测失败';
      console.warn('isSessionSupported 失败', e);
    });
  } else {
    $('enterVR').style.display = 'block';
    $('enterVR').disabled = true;
    $('enterVR').textContent = '非安全上下文或无 WebXR';
  }
}
function ctrlRay(ctrl){
  var origin = new THREE.Vector3(), dir = new THREE.Vector3();
  ctrl.getWorldPosition(origin);
  dir.set(0, 0, -1).transformDirection(ctrl.matrixWorld);
  return { origin: origin, dir: dir };
}
function enterVR(){
  resumeAudio();
  navigator.xr.requestSession('immersive-vr', {
    optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking', 'layers']
  }).then(function(session){
    xrSession = session;
    renderer.xr.setSession(session);
    document.body.classList.add('XR');
    session.addEventListener('end', function(){
      xrSession = null;
      document.body.classList.remove('XR');
    });
  }).catch(function(e){
    console.warn('进入 VR 失败', e);
    toast('进入 VR 失败：' + (e && e.message ? e.message : e));
  });
}

/* -------- 1.7 主循环 -------- */
function onResize(){
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
function animate(){
  var dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt; frames++;
  fpsT += dt;
  if (fpsT >= 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; updateStats(); }

  /* PC 行走 */
  if (!renderer.xr.isPresenting) {
    var sp = (keys.ShiftLeft || keys.ShiftRight) ? 3.2 : 1.7;
    var fwd = new THREE.Vector3(-Math.sin(player.rotation.y), 0, -Math.cos(player.rotation.y));
    var right = new THREE.Vector3(Math.cos(player.rotation.y), 0, -Math.sin(player.rotation.y));
    var mv = new THREE.Vector3();
    if (keys.KeyW || keys.ArrowUp) mv.add(fwd);
    if (keys.KeyS || keys.ArrowDown) mv.sub(fwd);
    if (keys.KeyD || keys.ArrowRight) mv.add(right);
    if (keys.KeyA || keys.ArrowLeft) mv.sub(right);
    if (mv.lengthSq() > 0) {
      mv.normalize().multiplyScalar(sp * dt);
      movePlayer(mv.x, mv.z);
    }
  }

  /* VR 摇杆：左右转 45°（防误触冷却） */
  if (renderer.xr.isPresenting) readVRStick(dt);

  /* 悬停检测 */
  updateHover();

  DEMO.update(dt);
  if (panelDirty) redrawPanel();

  renderer.render(scene, camera);
}
function movePlayer(dx, dz){
  player.position.x = clamp(player.position.x + dx, -4.4, 4.4);
  player.position.z = clamp(player.position.z + dz, -4.4, 4.4);
}
var snapCd = 0;
function readVRStick(dt){
  snapCd = Math.max(0, snapCd - dt);
  var src = xrSession && xrSession.inputSources;
  if (!src) return;
  for (var i = 0; i < src.length; i++) {
    var gp = src[i].gamepad;
    if (!gp || !gp.axes || gp.axes.length < 4) continue;
    if (Math.abs(gp.axes[2]) > 0.75 && snapCd <= 0) {
      player.rotation.y -= (gp.axes[2] > 0 ? -1 : 1) * Math.PI / 4;
      snapCd = 0.38;
    }
  }
}
function updateHover(){
  var r;
  if (renderer.xr.isPresenting) {
    if (!vrCtrls[0]) return;
    r = ctrlRay(vrCtrls[0]);
  } else {
    r = pcRay();
  }
  var p = pickPanel(r.origin, r.dir, 'hover');
  var id = p && p.button ? p.button.id : null;
  if (id !== hoverId) {
    hoverId = id;
    panelDirty = true;
    if (id) { pulse(null, 0.2, 30); beep(880, 35, 'sine', 0.035); }
    DEMO.onHover && DEMO.onHover(id);
  }
  DEMO.onAim && DEMO.onAim(r, p);
}
function updateStats(){
  if (!panel) return;
  var st = 'FPS ' + fps.toFixed(0) + ' · DrawCalls ' + renderer.info.render.calls +
           ' · Tris ' + renderer.info.render.triangles + '\n';
  var lines = CFG.hudLines ? CFG.hudLines() : [];
  for (var i = 0; i < lines.length; i++) st += lines[i] + '\n';
  $('stats').textContent = st;
}

/* ======================= 3. 演示实现（每个演示改这一段） ======================= */
/* A1 射线 / 悬停 / 三通道反馈
 * 单级（Midas）：射线一进入靶球就触发 → 记一次误触（misTouch）
 * 两级（推荐）：悬停只高亮 + 0.2 轻震 + 880Hz；点击/扳机才确认 → 0.5 + 1046Hz + 视觉脉冲
 * 每次交互后统计"本次给了几个通道"（视/听/触三灯）。
 */
var DEMO = {

  /* ---------- 世界 ---------- */
  buildWorld: function(){
    var i, t, g, o;
    for (i = 0; i < TGTS.length; i++) {
      t = TGTS[i];
      g = new THREE.Group();
      g.position.set(t.x, 0, t.z);

      var pole = new THREE.Mesh(
        new THREE.CylinderGeometry(0.032, 0.05, t.y, 10),
        new THREE.MeshStandardMaterial({ color: 0x3a4864, roughness: 0.85, metalness: 0.15 })
      );
      pole.position.y = t.y / 2; pole.castShadow = true; g.add(pole);

      var base = new THREE.Mesh(
        new THREE.CylinderGeometry(0.30, 0.34, 0.05, 20),
        new THREE.MeshStandardMaterial({ color: 0x2b3750, roughness: 0.9 })
      );
      base.position.y = 0.025; base.receiveShadow = true; g.add(base);

      var ball = new THREE.Mesh(
        new THREE.SphereGeometry(0.19, 24, 18),
        new THREE.MeshStandardMaterial({ color: t.color, emissive: t.color, emissiveIntensity: 0.22, roughness: 0.35 })
      );
      ball.position.y = t.y; ball.castShadow = true; ball.name = t.id; g.add(ball);

      /* 悬停高亮环：默认透明，悬停时显形 */
      var ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.27, 0.016, 8, 44),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 })
      );
      ring.position.y = t.y; g.add(ring);

      scene.add(g);
      o = { group: g, ball: ball, ring: ring, t: t, flash: 0 };
      tgt[t.id] = o;

      registerPick(ball, t.id, (function(id){
        return function(h){ DEMO.confirmTarget(id, h.source); };
      })(t.id));
    }

    /* 地面引导带：把玩家视线引向靶球 */
    var strip = new THREE.Mesh(
      new THREE.BoxGeometry(5.8, 0.006, 0.06),
      new THREE.MeshBasicMaterial({ color: 0x2f4a72 })
    );
    strip.position.set(0, 0.006, -4.5);
    scene.add(strip);
  },

  /* ---------- 面板 ---------- */
  buildUI: function(){
    var p = mkPanel(1.6, 0.8, 1024, 512);
    p.position.set(0, 1.40, -2.00);
    scene.add(p);
    uiButton('mode',  '模式：两级', 20, 404, 232, 78);
    uiButton('sound', '声音：开',   264, 404, 232, 78);
    uiButton('clear', '误触清零',   508, 404, 232, 78);
    uiButton('reset', '重置',      752, 404, 252, 78);
  },

  drawUI: function(ctx, W, H){
    var single = (S.mode === 'single');
    ctx.fillStyle = '#101a2c'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#3a4a6c'; ctx.lineWidth = 4; ctx.strokeRect(3, 3, W - 6, H - 6);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';

    ctx.fillStyle = '#9fd0ff';
    ctx.font = 'bold 40px "Microsoft YaHei", sans-serif';
    ctx.fillText('射线 · 悬停 · 三通道反馈', 32, 62);
    ctx.fillStyle = '#7f90ad';
    ctx.font = '24px "Microsoft YaHei", sans-serif';
    ctx.fillText('A1 + A4 · 单级 Midas 触摸 vs 两级确认 · 练习 E1', 32, 100);

    /* 模式块 */
    roundRect(ctx, 32, 126, 424, 82, 12);
    ctx.fillStyle = single ? '#4a1f2c' : '#12392c'; ctx.fill();
    ctx.strokeStyle = single ? '#ff8a8a' : '#5fd08a'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = single ? '#ffb9b9' : '#8ff0b6';
    ctx.font = 'bold 29px "Microsoft YaHei", sans-serif';
    ctx.fillText(single ? '单级：扫过 = 立刻触发' : '两级：悬停 → 点击确认', 52, 178);

    /* 三通道灯 */
    var lamps = [['视', '#7fc4ff', S.ch.v], ['听', '#ffd166', S.ch.a], ['触', '#ff8fa3', S.ch.h]];
    for (var i = 0; i < 3; i++) {
      var cx = 496 + i * 112, cy = 167;
      ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI * 2);
      ctx.fillStyle = lamps[i][2] ? lamps[i][1] : '#232f47';
      ctx.fill();
      ctx.strokeStyle = lamps[i][2] ? '#ffffff' : '#3a4a6c'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = lamps[i][2] ? '#0e1220' : '#7f90ad';
      ctx.font = 'bold 24px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center'; ctx.fillText(lamps[i][0], cx, cy + 9);
      ctx.textAlign = 'left';
    }
    ctx.fillStyle = '#cfe2ff';
    ctx.font = 'bold 32px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'right'; ctx.fillText(S.lastCh + '/3', 1000, 179); ctx.textAlign = 'left';

    /* 计数与提示 */
    ctx.fillStyle = '#dbe7ff';
    ctx.font = 'bold 31px "Microsoft YaHei", sans-serif';
    ctx.fillText('悬停 ' + S.hoverCount + '    确认 ' + S.confirmCount + '    误触 ' + S.misTouch, 32, 270);

    ctx.fillStyle = '#9fb0cc';
    ctx.font = '25px "Microsoft YaHei", sans-serif';
    ctx.fillText('上次：' + S.lastAction, 32, 310);

    ctx.fillStyle = single ? '#ffc857' : '#7f90ad';
    ctx.font = '22px "Microsoft YaHei", sans-serif';
    ctx.fillText(single
      ? '警示：单级模式下"路过"也算按下 —— 看误触数字涨得多快'
      : '两级模式：悬停只高亮 + 0.2 轻震 + 880Hz；点击才确认', 32, 350);
  },

  /* ---------- 交互 ---------- */
  onPick: function(id, src){
    if (id === 'mode') {
      S.mode = (S.mode === 'two') ? 'single' : 'two';
      S.hoverTarget = null;
      setBtnLabel('mode', S.mode === 'single' ? '模式：单级' : '模式：两级');
      S.lastAction = '切换模式 → ' + (S.mode === 'single' ? '单级 Midas' : '两级确认');
      toast(single() ? '单级 Midas：射线扫过靶球就触发（注意误触）' : '两级确认：悬停高亮，点击才确认');
    } else if (id === 'sound') {
      S.sound = !S.sound; S.mute = !S.sound;
      setBtnLabel('sound', S.sound ? '声音：开' : '声音：关');
      S.lastAction = '声音' + (S.sound ? '开' : '关') + '（听/触至少留一个通道）';
    } else if (id === 'clear') {
      S.misTouch = 0;
      S.lastAction = '误触计数已清零';
      toast('误触计数清零');
    } else if (id === 'reset') {
      DEMO.reset();
      toast('已重置');
    }
    panelDirty = true;
  },

  onKey: function(code){
    if (!DEMO.keyGate(code)) return;
    if (code === 'KeyM') fireButton('mode', 'pc');
    else if (code === 'KeyE') fireButton('sound', 'pc');
    else if (code === 'KeyC') fireButton('clear', 'pc');
    else if (code === 'KeyF') { DEMO.setHover(S.pinHover || 't2'); toast('F：演示用，直接对靶球 B 做一次悬停'); }
  },
  keyGate: function(code){
    var now = Date.now();
    if (_keyCd[code] && now - _keyCd[code] < 260) return false;
    _keyCd[code] = now;
    return true;
  },

  /* 悬停进入：两级只高亮；单级直接触发（记误触） */
  hoverEnter: function(id){
    var t = findT(id);
    if (!t) return;
    S.hoverCount++;
    S.ch = { v: true, a: !!S.sound, h: true };
    S.lastCh = 1 + (S.sound ? 1 : 0) + 1;
    pulse(hapticSrc(), 0.2, 30);                /* 轻震 0.2（VR 下发给真手柄） */
    beep(880, 35, 'sine', 0.035);               /* 悬停提示音 880Hz */
    S.lastAction = '悬停 ' + t.name + '（未确认）';
    if (S.mode === 'single') DEMO.triggerTarget(id, 'midas');
    panelDirty = true;
  },

  /* 触发：单级自动 / 两级点击确认 */
  triggerTarget: function(id, how, quiet){
    var t = findT(id);
    if (!t) return false;
    S.pulse = 1;
    S.ch = { v: true, a: !!S.sound, h: true };
    S.lastCh = 1 + (S.sound ? 1 : 0) + 1;
    pulse(hapticSrc(), 0.5, 70);                /* 确认震 0.5（VR 下发给真手柄） */
    beep(1046, 55, 'square', 0.05);              /* 确认音 1046Hz */
    tgt[id].flash = 1;
    if (how === 'midas') {
      S.misTouch++;
      S.lastAction = '单级误触：' + t.name + '（手一抖就触发）';
      if (!quiet) toast('误触！' + t.name + ' 只是被射线扫过');
    } else {
      S.confirmCount++;
      S.lastAction = '两级确认：' + t.name;
      if (!quiet) toast('确认 ' + t.name + '：视觉 + 听觉 + 触觉');
    }
    panelDirty = true;
    return true;
  },

  /* 点击/扳机落到靶球上：两级=确认；单级=再触发一次（同样记误触） */
  confirmTarget: function(id, src){
    if (S.mode === 'single') return DEMO.triggerTarget(id, 'midas', src === 'api');
    DEMO.setHover(id);
    return DEMO.triggerTarget(id, 'confirm', src === 'api');
  },

  /* 设置悬停目标（真正驱动高亮的唯一入口；update 与 api.hover 都走这里） */
  setHover: function(id){
    var changed = (id !== S.hoverTarget);
    S.hoverTarget = id || null;
    DEMO.applyHoverVisual();
    if (changed && S.hoverTarget) DEMO.hoverEnter(S.hoverTarget);
    panelDirty = true;
    return changed;
  },

  applyHoverVisual: function(){
    for (var k in tgt) {
      if (!tgt.hasOwnProperty(k)) continue;
      var on = (S.hoverTarget === k);
      tgt[k].ring.material.opacity = on ? 0.9 : 0;
      tgt[k].ball.material.emissiveIntensity = on ? 0.85 : 0.22;
    }
  },

  /* ---------- 每帧 ---------- */
  update: function(dt){
    ensureApi();

    var i, t, o;
    for (i = 0; i < TGTS.length; i++) {
      t = TGTS[i]; o = tgt[t.id];
      if (!o) continue;
      var on = (S.hoverTarget === t.id);
      o.ball.material.emissiveIntensity = on
        ? (0.72 + Math.sin(elapsed * 7) * 0.18 + o.flash * 1.6)
        : (0.22 + o.flash * 1.6);
      o.ball.scale.setScalar(1 + (on ? 0.06 : 0) + Math.sin(elapsed * 1.6 + i) * 0.012 + o.flash * 0.18);
      o.ring.material.opacity = on ? 0.9 : 0;
      o.ring.scale.setScalar(1 + o.flash * 0.35);
      o.ring.rotation.z += dt * (on ? 2.4 : 0.8);
      o.flash = Math.max(0, o.flash - dt * 2.6);
    }
    S.pulse = Math.max(0, S.pulse - dt * 2.6);

    /* 射线悬停（PC 鼠标射线 / VR 手柄射线，同一套逻辑） */
    var id = null;
    if (S.pinHover) {
      id = S.pinHover;
    } else {
      var r = null;
      if (renderer.xr.isPresenting) {
        if (vrCtrls[0]) r = ctrlRay(vrCtrls[0]);
      } else {
        r = pcRay();
      }
      if (r) {
        var h = pickWorld(r.origin, r.dir, 'hover');
        if (h && h.item) id = h.item.id;
      }
    }
    if (id !== S.hoverTarget) DEMO.setHover(id);

    /* HUD 实时状态：首帧 + 每 0.15 s 刷新一次（无头虚拟时间下也稳定出数） */
    S._hudT = (S._hudT || 0) + dt;
    if (!S._hudInit || S._hudT >= 0.15) { S._hudInit = true; S._hudT = 0; updateStats(); }
  },

  /* ---------- 重置 ---------- */
  reset: function(){
    S.mode = 'two'; S.sound = true; S.mute = false;
    S.hoverTarget = null; S.pinHover = null;
    S.hoverCount = 0; S.confirmCount = 0; S.misTouch = 0;
    S.ch = { v: false, a: false, h: false }; S.lastCh = 0; S.pulse = 0;
    S.lastAction = '—'; S.lastPick = '—'; S.picks = 0;
    hapticLog.length = 0; sfxLog.length = 0; _keyCd = {};
    if (camera) camera.rotation.x = 0;
    if (player) { player.position.set(0, 0, 0); player.rotation.y = 0; }
    setBtnLabel('mode', '模式：两级');
    setBtnLabel('sound', '声音：开');
    for (var k in tgt) {
      if (!tgt.hasOwnProperty(k)) continue;
      tgt[k].flash = 0; tgt[k].ring.material.opacity = 0;
      tgt[k].ball.material.emissiveIntensity = 0.22;
      tgt[k].ball.scale.setScalar(1);
    }
    panelDirty = true;
  },

  /* ---------- 自测（≥8 条真实机制断言） ---------- */
  selfTest: function(){
    ensureApi();
    var pass = [], fail = [], T = function(ok, name){ (ok ? pass : fail).push(name); };
    DEMO.reset();

    T(!!panel, '面板已创建（CanvasTexture）');
    T(panelBtns.length === 4, '面板按钮 4 个：模式/声音/误触清零/重置');
    T(!!tgt.t1 && !!tgt.t2 && !!tgt.t3, '三颗靶球都已注册为可拾取物体');
    T(hapticLog.length === 0 && sfxLog.length === 0, 'reset 清空触觉与音效日志');

    /* ① 单级：悬停即触发 */
    S.mode = 'single';
    DEMO.setHover('t1');
    T(S.misTouch === 1 && S.confirmCount === 0, '① 单级模式悬停即触发：误触 +1、确认不增加');
    T(S.lastAction.indexOf('误触') >= 0, '① 单级触发被如实标记为“误触”');

    /* ② 两级：悬停不触发 */
    S.mode = 'two';
    DEMO.setHover(null);
    var mt0 = S.misTouch, cf0 = S.confirmCount, hv0 = S.hoverCount;
    DEMO.setHover('t2');
    T(S.misTouch === mt0 && S.confirmCount === cf0 && S.hoverCount === hv0 + 1,
      '② 两级模式悬停不触发（误触/确认不变，只记悬停）');
    T(tgt.t2.ring.material.opacity > 0.5, '② 两级模式悬停只做高亮（描边环显形）');

    /* ③ 两级点击才确认 */
    DEMO.confirmTarget('t2', 'pc');
    T(S.confirmCount === cf0 + 1 && S.misTouch === mt0, '③ 两级模式点击才确认：确认 +1、误触不变');

    /* ④ 触觉两档 + ⑤ 音效两类 */
    var h02 = false, h05 = false, i;
    for (i = 0; i < hapticLog.length; i++) {
      if (Math.abs(hapticLog[i].intensity - 0.2) < 0.001) h02 = true;
      if (Math.abs(hapticLog[i].intensity - 0.5) < 0.001) h05 = true;
    }
    T(h02 && h05, '④ 触觉日志同时含 0.2（悬停）与 0.5（确认）两档');
    var f880 = false, f1046 = false, audio = 0;
    for (i = 0; i < sfxLog.length; i++) {
      if (sfxLog[i].freq === 880) f880 = true;
      if (sfxLog[i].freq === 1046) f1046 = true;
      if (!sfxLog[i].skipped) audio++;
    }
    T(f880 && f1046, '⑤ 音效日志含 880Hz（悬停）与 1046Hz（确认）');

    /* ⑥ 通道计数 */
    T(S.lastCh >= 2 && S.ch.v && S.ch.h, '⑥ 本次交互通道数 ≥2（视觉 + 触觉必给，有声时 3）');
    T(S.lastCh === 3 && S.ch.a, '⑥ 声音开启时三通道齐全 = 3/3');

    /* ⑦ 两种模式的计数互不污染 */
    DEMO.reset();
    S.mode = 'single';
    DEMO.setHover('t3');
    var mSingle = S.misTouch, cSingle = S.confirmCount;
    S.mode = 'two';
    DEMO.setHover(null);
    DEMO.setHover('t1');
    T(mSingle === 1 && cSingle === 0 && S.misTouch === 1 && S.confirmCount === 0,
      '⑦ 单级误触计数与两级确认计数互不污染');

    /* ⑧ 关声音后通道数降为 2（诚实统计） */
    fireButton('sound', 'test');
    DEMO.setHover(null);
    DEMO.confirmTarget('t2', 'test');
    T(S.sound === false && S.lastCh === 2 && S.ch.a === false,
      '⑧ 关闭声音后通道数如实降为 2（视觉 + 触觉）');

    /* ⑨ reset 全清 */
    DEMO.reset();
    T(S.hoverCount === 0 && S.confirmCount === 0 && S.misTouch === 0 &&
      S.lastCh === 0 && S.hoverTarget === null && S.mode === 'two' &&
      hapticLog.length === 0 && sfxLog.length === 0,
      '⑨ reset 清零：计数/日志/悬停/模式全部复位');

    /* ⑩ 渲染确实在跑 */
    T(renderer.info.render.calls > 0, '⑩ animate 正在渲染（CALLS>0）');

    DEMO.reset();
    return { pass: pass, fail: fail };
  }
};

/* ---------- 小工具 ---------- */
/* VR 下把手柄 inputSource 传给 pulse()，PC 下返回 null（只记日志） */
function hapticSrc(){
  if (renderer && renderer.xr && renderer.xr.isPresenting && vrCtrls[0]) {
    return vrCtrls[0].userData.inputSource || null;
  }
  return null;
}
function single(){ return S.mode === 'single'; }
function findT(id){
  for (var i = 0; i < TGTS.length; i++) if (TGTS[i].id === id) return TGTS[i];
  return null;
}
function setBtnLabel(id, label){
  for (var i = 0; i < panelBtns.length; i++) {
    if (panelBtns[i].id === id) { panelBtns[i].label = label; break; }
  }
  panelDirty = true;
}

/* 在基础设施创建的 window.LAB.api 上补齐本演示的调试/截图接口
 * （不改第 4 段启动代码，首次 update 时挂载） */
function ensureApi(){
  if (!window.LAB || !window.LAB.api || window.LAB.api.__lab01) return;
  var A = window.LAB.api;
  A.__lab01 = true;
  A.setMode = function(m){
    S.mode = (m === 'single') ? 'single' : 'two';
    S.hoverTarget = null;
    setBtnLabel('mode', S.mode === 'single' ? '模式：单级' : '模式：两级');
    panelDirty = true;
    return S.mode;
  };
  A.hover = function(id){
    S.pinHover = id || null;
    DEMO.setHover(id || null);
    return S.hoverTarget;
  };
  A.confirm = function(id){
    var target = id || S.hoverTarget || 't2';
    DEMO.setHover(target);
    DEMO.confirmTarget(target, 'api');
    return S.lastAction;
  };
  A.hapticLevels = function(){
    var out = [];
    for (var i = 0; i < hapticLog.length; i++) out.push(hapticLog[i].intensity);
    return out;
  };
}

/* ======================= 4. 启动（不要改） ======================= */
function boot(){
  renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local-floor');

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e1220);
  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 60);
  camera.position.set(0, 1.6, 0);
  player = new THREE.Group();
  player.add(camera);
  scene.add(player);
  clock = new THREE.Clock();

  buildBase();
  DEMO.buildWorld();
  DEMO.buildUI();
  setupVR();
  setupPC();

  document.title = CFG.id.toUpperCase() + ' · ' + CFG.title;
  $('hudTitle').textContent = CFG.title;
  $('hudTag').textContent = CFG.subtitle;
  $('loadTitle').textContent = CFG.title;
  $('hudPC').innerHTML = '<b>PC 操作</b><br>' + CFG.pcKeys;
  $('hudVR').innerHTML = '<b>头显操作</b><br>' + CFG.vrKeys;
  $('hudTeach').innerHTML = '<b>课堂要点</b><br>' + CFG.teach;
  redrawPanel();

  window.LAB = {
    S: S, scene: scene, camera: camera, renderer: renderer, player: player, cfg: CFG,
    ui: { panel: function(){ return panel; }, buttons: function(){ return panelBtns; },
          hover: function(){ return hoverId; } },
    api: {
      fire: fireButton,
      reset: DEMO.reset,
      getState: function(){ return JSON.parse(JSON.stringify(S)); },
      setState: function(k, v){ S[k] = v; panelDirty = true; },
      haptics: function(){ return hapticLog.slice(); },
      sfx: function(){ return sfxLog.slice(); },
      selfTest: function(){
        var r = DEMO.selfTest();
        console.log('SELFTEST PASS ' + r.pass.length + ' / FAIL ' + r.fail.length);
        if (r.fail.length) console.log('SELFTEST FAILED: ' + r.fail.join(' | '));
        return r;
      }
    }
  };

  var loader = $('loader');
  $('loadMsg').textContent = '就绪 · ' + CFG.part;
  setTimeout(function(){ loader.style.opacity = '0'; setTimeout(function(){ loader.remove(); }, 520); }, 180);

  onResize();
  renderer.setAnimationLoop(animate);
}
try { boot(); }
catch (e) {
  console.error('启动失败', e);
  var lm = document.getElementById('loadMsg');
  if (lm) lm.textContent = '启动失败：' + e.message;
}
})();
</script>
</body>
