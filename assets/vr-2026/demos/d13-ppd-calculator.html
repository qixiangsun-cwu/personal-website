<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>13 · PPD 计算器</title>
<style>
  :root{--bg:#0f1420;--card:#1b2233;--line:#2c3750;--txt:#eaf0fa;--sub:#9fb0c8;--acc:#4da3ff;--good:#57d39a;--warn:#ffc857;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei",system-ui,sans-serif;line-height:1.7;padding:26px;}
  h1{font-size:22px;margin-bottom:4px;}
  .badge{display:inline-block;background:#3a2b1a;color:var(--warn);border:1px solid #6a5128;border-radius:6px;padding:2px 8px;font-size:12px;margin-bottom:16px;}
  .wrap{max-width:820px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px;}
  label{display:block;color:var(--sub);font-size:13px;margin:10px 0 4px;}
  input[type=number]{width:180px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#111827;color:var(--txt);font-size:15px;}
  .presets button{background:#111827;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 6px 0 0;cursor:pointer;}
  .presets button:hover{border-color:var(--acc);}
  .result{font-size:34px;font-weight:800;color:var(--acc);margin:10px 0 4px;}
  .bar{height:16px;background:#111827;border:1px solid var(--line);border-radius:8px;position:relative;margin:10px 0 26px;overflow:hidden;}
  .bar .fill{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#4da3ff,#57d39a);}
  .marks{position:relative;height:24px;color:var(--sub);font-size:12px;}
  .marks span{position:absolute;transform:translateX(-50%);}
  .formula{color:var(--sub);font-size:14px;background:#0d1320;border-radius:8px;padding:10px 12px;margin-top:8px;}
  .verdict{font-size:16px;margin-top:8px;font-weight:600;}
</style>
</head>
<body>
<h1>13 · PPD 计算器（每度像素数）</h1>
<span class="badge">工具演示 · 非立体效果</span>
<div class="wrap">
  <div class="panel">
    <div class="formula"><strong>PPD ≈ 单眼水平像素数 ÷ 单眼水平视场角（°）</strong></div>
    <label>单眼水平像素数（px）</label>
    <input type="number" id="px" value="2160" min="100" step="10">
    <label>单眼水平视场角（°）</label>
    <input type="number" id="fov" value="102" min="10" max="180" step="1">
    <div class="presets">
      <button data-px="2160" data-fov="102">PICO 4 Ultra</button>
      <button data-px="2064" data-fov="96">Quest 3（参考）</button>
      <button data-px="3686" data-fov="100">Vision Pro（参考）</button>
      <button data-px="1920" data-fov="90">早期一体机</button>
    </div>
  </div>
  <div class="panel">
    <div class="result" id="ppd">21</div>
    <div class="verdict" id="verdict"></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="marks">
      <span style="left:0%">0</span>
      <span id="m20" style="left:33.3%">20 PPD（告别明显纱窗）</span>
      <span id="m60" style="left:100%">60 PPD（接近视网膜级）</span>
    </div>
    <p style="color:var(--sub);font-size:13px;margin-top:18px;">阈值是经验口径，非绝对标准；不同设备单眼 FOV 口径有差异，结果仅用于趋势对比。</p>
  </div>
</div>
<script>
  const pxEl=document.getElementById('px'), fovEl=document.getElementById('fov');
  const ppdEl=document.getElementById('ppd'), verdictEl=document.getElementById('verdict'), fillEl=document.getElementById('fill');
  function calc(){
    const px=+pxEl.value||0, fov=+fovEl.value||1;
    const ppd=px/fov;
    ppdEl.textContent=ppd.toFixed(1);
    const pct=Math.min(100, ppd/60*100);
    fillEl.style.width=pct+'%';
    let v;
    if(ppd<20){v='低于约 20 PPD：可能出现较明显的“纱窗效应”。';verdictEl.style.color='#ff8f8f';}
    else if(ppd<45){v='介于 20—45 PPD：已明显改善纱窗效应，但仍低于视网膜级。';verdictEl.style.color='#ffc857';}
    else if(ppd<60){v='45—60 PPD：清晰度较高，接近视网膜级目标。';verdictEl.style.color='#57d39a';}
    else{v='≥60 PPD：接近常用“视网膜级”经验阈值。';verdictEl.style.color='#57d39a';}
    verdictEl.textContent='结论：'+v;
  }
  document.querySelectorAll('.presets button').forEach(b=>{
    b.addEventListener('click',()=>{pxEl.value=b.dataset.px;fovEl.value=b.dataset.fov;calc();});
  });
  pxEl.addEventListener('input',calc); fovEl.addEventListener('input',calc);
  calc();
</script>
</body>
</html>
