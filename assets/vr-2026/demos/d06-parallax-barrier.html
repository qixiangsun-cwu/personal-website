<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>06 · 视差屏障</title>
<style>
  :root{--bg:#0f1420;--card:#1b2233;--line:#2c3750;--txt:#eaf0fa;--sub:#9fb0c8;--acc:#4da3ff;--warn:#ffc857;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei",system-ui,sans-serif;line-height:1.6;padding:22px;}
  h1{font-size:21px;margin-bottom:4px;}
  .badge{display:inline-block;background:#3a2b1a;color:var(--warn);border:1px solid #6a5128;border-radius:6px;padding:2px 8px;font-size:12px;margin-bottom:12px;}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;}
  canvas{background:#0a0f1a;border:1px solid var(--line);border-radius:12px;max-width:100%;}
  .side{min-width:260px;max-width:340px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .panel h3{font-size:14px;color:var(--acc);margin-bottom:8px;}
  label{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0;}
  input[type=range]{flex:1;}
  .note{color:var(--sub);font-size:12px;margin-top:10px;}
</style>
</head>
<body>
<h1>06 · 视差屏障（裸眼 3D）</h1>
<span class="badge">原理示意（俯视光线图）</span>
<div class="row">
  <canvas id="cv" width="820" height="420"></canvas>
  <div class="side">
    <div class="panel">
      <h3>参数</h3>
      <label>狭缝宽度 <span id="wv">14</span></label>
      <input type="range" id="slit" min="4" max="26" step="1" value="14">
      <label>观察者横向位置 <span id="cxv">0</span></label>
      <input type="range" id="viewx" min="-120" max="120" step="2" value="0">
      <p class="note">绿线=该眼看到了“正确”的像素；红线=串扰（该眼看到另一眼的像素）。把观察者横向移动，看串扰如何增多。</p>
    </div>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const screenY=70, barY=210, eyeY=350;
const x0=120, x1=690, n=20, p=(x1-x0)/n;
function pixelX(i){return x0+i*p+p/2;}
function type(i){return i%2===0?'L':'R';}
function slitX(j){return x0+j*p;} // 像素边界
function draw(){
  const slitW=+document.getElementById('slit').value;
  const viewX=+document.getElementById('viewx').value;
  document.getElementById('wv').textContent=slitW;
  document.getElementById('cxv').textContent=viewX;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a0f1a';ctx.fillRect(0,0,W,H);
  // 屏幕
  ctx.strokeStyle='#4da3ff';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x0-20,screenY);ctx.lineTo(x1+20,screenY);ctx.stroke();
  ctx.fillStyle='#9fb0c8';ctx.font='12px Microsoft YaHei';ctx.fillText('显示面板（L/R 子像素）',x0-20,screenY-8);
  for(let i=0;i<n;i++){
    const x=pixelX(i);
    ctx.fillStyle=type(i)==='L'?'#ff8f8f':'#7fd8ff';
    ctx.fillRect(x-5,screenY-4,10,8);
    ctx.fillStyle='#0a0f1a';ctx.font='9px Microsoft YaHei';ctx.fillText(type(i),x-3,screenY+2);
  }
  // 屏障（暗条 + 狭缝空隙）
  ctx.fillStyle='#111827';
  ctx.fillRect(x0-20,barY-12,x1-x0+40,24);
  for(let j=0;j<=n;j++){
    const x=slitX(j);
    ctx.fillStyle='#0a0f1a';
    ctx.fillRect(x-slitW/2,barY-12,slitW,24);
  }
  ctx.fillStyle='#9fb0c8';ctx.fillText('视差屏障（透光-遮光条）',x0-20,barY+28);
  // 眼睛
  const ipd=64;
  const exL=W/2+viewX-ipd/2, exR=W/2+viewX+ipd/2;
  drawEye(exL,eyeY,'左眼'); drawEye(exR,eyeY,'右眼');
  // 光线
  for(let j=1;j<n;j++){
    const sx=slitX(j);
    // 左眼
    let hit=screenHit(exL,eyeY,sx,barY);
    drawRay(exL,eyeY,sx,barY,hit,screenY,'L');
    // 右眼
    hit=screenHit(exR,eyeY,sx,barY);
    drawRay(exR,eyeY,sx,barY,hit,screenY,'R');
  }
}
function screenHit(ex,ey,sx,by){
  return ex+(sx-ex)*ey/(ey-by);
}
function nearestPixel(x){
  let best=0,bd=1e9;
  for(let i=0;i<n;i++){const d=Math.abs(pixelX(i)-x);if(d<bd){bd=d;best=i;}}
  return best;
}
function drawRay(ex,ey,sx,by,hit,sy,eye){
  const pi=nearestPixel(hit);
  const correct=(eye==='L'&&type(pi)==='L')||(eye==='R'&&type(pi)==='R');
  ctx.strokeStyle=correct?'rgba(87,211,154,0.55)':'rgba(255,90,90,0.55)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(sx,by);ctx.lineTo(hit,sy);ctx.stroke();
}
function drawEye(x,y,label){
  ctx.fillStyle='#eaf0fa';ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0f1420';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#9fb0c8';ctx.font='11px Microsoft YaHei';ctx.fillText(label,x-14,y+24);
}
['slit','viewx'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
draw();
</script>
</body>
</html>
