<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 · 分色立体（红青）</title>
<style>
  :root{--bg:#0f1420;--card:#1b2233;--line:#2c3750;--txt:#eaf0fa;--sub:#9fb0c8;--acc:#4da3ff;--warn:#ffc857;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei",system-ui,sans-serif;line-height:1.6;padding:22px;}
  h1{font-size:21px;margin-bottom:4px;}
  .badge{display:inline-block;background:#3a2b1a;color:var(--warn);border:1px solid #6a5128;border-radius:6px;padding:2px 8px;font-size:12px;margin-bottom:12px;}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;}
  canvas{background:#0a0f1a;border:1px solid var(--line);border-radius:12px;max-width:100%;}
  .side{min-width:250px;max-width:330px;}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;}
  .panel h3{font-size:14px;color:var(--acc);margin-bottom:8px;}
  label{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0;}
  input[type=range]{flex:1;}
  .note{color:var(--sub);font-size:12px;margin-top:8px;}
</style>
</head>
<body>
<h1>03 · 分色立体（红青 Anaglyph）</h1>
<span class="badge">唯一可在普通屏幕上真身体验立体的方案（需红青眼镜）</span>
<div class="row">
  <canvas id="cv" width="820" height="480"></canvas>
  <div class="side">
    <div class="panel">
      <h3>参数</h3>
      <label>视差强度 <span id="sv">1.0</span></label>
      <input type="range" id="str" min="-1.5" max="1.5" step="0.05" value="1">
      <label><input type="checkbox" id="onlyL"> 只看左眼（红）</label>
      <label><input type="checkbox" id="onlyR"> 只看右眼（青）</label>
      <p class="note">正强度=物体“入屏”（屏幕后方）；负强度=“出屏”（冲到屏幕前）。戴上「左红右青」眼镜可看到立体。</p>
    </div>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height,f=340,cx=W/2,cy=H*0.52;
const spheres=[
  {x:-1.0,z:3.0,r:0.32,c:'#ff7b6b'},
  {x: 0.4,z:4.2,r:0.34,c:'#ffd166'},
  {x: 1.3,z:5.5,r:0.34,c:'#6bc7ff'},
  {x:-1.6,z:7.5,r:0.34,c:'#c39bff'},
  {x: 0.6,z:9.5,r:0.36,c:'#57d39a'}
];
function draw(){
  const str=+document.getElementById('str').value;
  const onlyL=document.getElementById('onlyL').checked, onlyR=document.getElementById('onlyR').checked;
  document.getElementById('sv').textContent=str.toFixed(2);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0a0f1a';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1a2334';ctx.fillRect(0,0,W,cy);
  ctx.fillStyle='#0c101a';ctx.fillRect(0,cy,W,H-cy);
  const sorted=[...spheres].sort((a,b)=>b.z-a.z);
  for(const s of sorted){
    const sx=cx+s.x*f/s.z, sy=cy-(0-0.4)*f/s.z, r=s.r*f/s.z;
    const d=str*120/s.z; // 视差：近大远小，强度可正可负
    if(!onlyR){ctx.fillStyle='rgba(255,60,60,0.62)';ctx.beginPath();ctx.arc(sx-d/2,sy,r,0,Math.PI*2);ctx.fill();}
    if(!onlyL){ctx.fillStyle='rgba(60,220,255,0.62)';ctx.beginPath();ctx.arc(sx+d/2,sy,r,0,Math.PI*2);ctx.fill();}
  }
}
['str','onlyL','onlyR'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
document.getElementById('onlyL').addEventListener('change',draw);
document.getElementById('onlyR').addEventListener('change',draw);
draw();
</script>
</body>
</html>
