<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <rect width="760" height="360" fill="#faf8fd"/>
  <text x="380" y="32" text-anchor="middle" font-size="19" font-weight="700" fill="#2e2a6f">晕动症 = 眼睛说"在动"，前庭说"没动"</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#5a5670">感觉冲突 → 恶心 / 出汗 / 眩晕；视觉流越强越晕，所以"少动、慢动、挡住周边"是三条主线</text>

  <!-- 左：感觉冲突 -->
  <rect x="26" y="82" width="330" height="196" rx="12" fill="#fff" stroke="#e3ddf1"/>
  <text x="46" y="108" font-size="14" font-weight="700" fill="#2e2a6f">① 冲突从哪来</text>

  <rect x="46" y="126" width="128" height="52" rx="9" fill="#eeeafb" stroke="#5a52c8"/>
  <text x="110" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#2e2a6f">眼睛</text>
  <text x="110" y="166" text-anchor="middle" font-size="11.5" fill="#5a5670">画面在高速移动</text>

  <rect x="206" y="126" width="128" height="52" rx="9" fill="#fdf3e3" stroke="#b45309"/>
  <text x="270" y="148" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">前庭（内耳）</text>
  <text x="270" y="166" text-anchor="middle" font-size="11.5" fill="#5a5670">身体其实没动</text>

  <path d="M174 152 H198" stroke="#8b879e" stroke-width="2" marker-end="url(#m)"/>
  <defs><marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#8b879e"/></marker></defs>
  <text x="186" y="142" text-anchor="middle" font-size="14" fill="#8b879e">≠</text>

  <rect x="46" y="196" width="288" height="30" rx="8" fill="#fdf3e3" stroke="#efdcb5"/>
  <text x="190" y="216" text-anchor="middle" font-size="12" fill="#7a4a0a">大脑收到矛盾信号 → 不适</text>

  <text x="46" y="250" font-size="11.5" fill="#5a5670">推论：新手 10—15 分钟就可能不适；</text>
  <text x="46" y="268" font-size="11.5" fill="#5a5670">这是"脱敏"，不是"体质差"。</text>

  <!-- 右：三条主线 -->
  <rect x="376" y="82" width="358" height="196" rx="12" fill="#fff" stroke="#e3ddf1"/>
  <text x="396" y="108" font-size="14" font-weight="700" fill="#2e2a6f">② 设计上的三条主线</text>

  <rect x="396" y="122" width="318" height="40" rx="8" fill="#eeeafb"/>
  <text x="408" y="140" font-size="12.5" font-weight="700" fill="#2e2a6f">少动</text>
  <text x="452" y="140" font-size="12" fill="#5a5670">默认瞬移 + Snap 45°；小空间干脆不移动</text>
  <rect x="396" y="170" width="318" height="40" rx="8" fill="#eeeafb"/>
  <text x="408" y="188" font-size="12.5" font-weight="700" fill="#2e2a6f">慢动</text>
  <text x="452" y="188" font-size="12" fill="#5a5670">加速曲线要缓；绝不强制旋转相机</text>
  <rect x="396" y="218" width="318" height="40" rx="8" fill="#eeeafb"/>
  <text x="408" y="236" font-size="12.5" font-weight="700" fill="#2e2a6f">挡周边</text>
  <text x="452" y="236" font-size="12" fill="#5a5670">边缘遮罩 / 隧道视野：缩小视觉流面积</text>

  <!-- 底部：隧道视野示意 -->
  <rect x="26" y="294" width="708" height="46" rx="10" fill="#0f1420"/>
  <rect x="26" y="294" width="708" height="46" rx="10" fill="url(#vig)"/>
  <defs>
    <radialGradient id="vig" cx="50%" cy="50%" r="60%">
      <stop offset="55%" stop-color="#0f1420" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0f1420" stop-opacity="0.92"/>
    </radialGradient>
  </defs>
  <text x="380" y="322" text-anchor="middle" font-size="12.5" fill="#d9e6ff">隧道视野：移动时把四周压暗，只留中间清晰区 —— 视觉流变小，晕感下降（强度 0 / 0.5 / 1 可调，见 lab07）</text>
</svg>
