<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5a52c8"/>
    </marker>
    <marker id="ma" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#ffffff"/>

  <text x="24" y="30" font-size="19" font-weight="700" fill="#272436">视频扩散世界模型：训练学速度场，推理走少步，长视频靠自回归</text>
  <text x="24" y="52" font-size="12.5" fill="#5a5670">三个动作就能概括：把视频压进潜空间、学会把噪声推回视频、一块一块往后接。</text>

  <!-- Panel 1: training -->
  <rect x="20" y="68" width="920" height="132" rx="12" fill="#f6f5fb" stroke="#e3ddf1"/>
  <text x="36" y="92" font-size="12.5" font-weight="700" fill="#2e2a6f">① 训练：只看“往哪个方向去”</text>

  <rect x="36" y="106" width="118" height="54" rx="9" fill="#ffffff" stroke="#8b7fd4"/>
  <text x="46" y="128" font-size="11.5" font-weight="700" fill="#272436">视频片段</text>
  <text x="46" y="146" font-size="10.5" fill="#5a5670">T 帧 · 多视角</text>
  <line x1="154" y1="133" x2="176" y2="133" stroke="#5a52c8" stroke-width="1.5" marker-end="url(#m)"/>

  <rect x="180" y="106" width="140" height="54" rx="9" fill="#ffffff" stroke="#8b7fd4"/>
  <text x="190" y="128" font-size="11.5" font-weight="700" fill="#272436">时空 Tokenizer</text>
  <text x="190" y="146" font-size="10.5" fill="#5a5670">8× 空间 · 4× 时间</text>
  <line x1="320" y1="133" x2="342" y2="133" stroke="#5a52c8" stroke-width="1.5" marker-end="url(#m)"/>

  <rect x="346" y="106" width="104" height="54" rx="9" fill="#eef0ff" stroke="#5a52c8" stroke-width="1.4"/>
  <text x="356" y="128" font-size="11.5" font-weight="700" fill="#2e2a6f">潜变量 z₀</text>
  <text x="356" y="146" font-size="10.5" fill="#5a5670">连续 · 低维</text>
  <line x1="450" y1="133" x2="472" y2="133" stroke="#5a52c8" stroke-width="1.5" marker-end="url(#m)"/>

  <rect x="476" y="106" width="118" height="54" rx="9" fill="#ffffff" stroke="#8b7fd4"/>
  <text x="486" y="128" font-size="11.5" font-weight="700" fill="#272436">加噪 → z_t</text>
  <text x="486" y="146" font-size="10.5" fill="#5a5670">t ~ U(0,1)</text>
  <line x1="594" y1="133" x2="616" y2="133" stroke="#5a52c8" stroke-width="1.5" marker-end="url(#m)"/>

  <rect x="620" y="106" width="146" height="54" rx="9" fill="#fff6e5" stroke="#b45309" stroke-width="1.4"/>
  <text x="630" y="128" font-size="11.5" font-weight="700" fill="#7c3a00">DiT 预测速度 v</text>
  <text x="630" y="146" font-size="10.5" fill="#5a5670">条件走 cross-attn</text>
  <line x1="766" y1="133" x2="788" y2="133" stroke="#5a52c8" stroke-width="1.5" marker-end="url(#m)"/>

  <rect x="792" y="106" width="132" height="54" rx="9" fill="#ffffff" stroke="#8b7fd4"/>
  <text x="802" y="128" font-size="11.5" font-weight="700" fill="#272436">损失</text>
  <text x="802" y="146" font-size="10.5" fill="#5a5670">‖v − (z₁−z₀)‖²</text>

  <text x="36" y="182" font-size="10.5" fill="#5a5670">不必死记公式：就是“从噪声走到数据”那条路径的切线，网络只学切线的方向和长度。</text>

  <!-- Panel 2: inference -->
  <rect x="20" y="212" width="920" height="128" rx="12" fill="#f6f5fb" stroke="#e3ddf1"/>
  <text x="36" y="236" font-size="12.5" font-weight="700" fill="#2e2a6f">② 推理：条件决定“往哪走”，步数决定“多快”</text>

  <rect x="36" y="250" width="150" height="72" rx="9" fill="#ffffff" stroke="#8b7fd4"/>
  <text x="46" y="270" font-size="11" font-weight="700" fill="#272436">条件（三选多）</text>
  <text x="46" y="288" font-size="10.5" fill="#5a5670">动作 / 位姿 / 文本</text>
  <text x="46" y="305" font-size="10.5" fill="#5a5670">上一帧 / 规划轨迹</text>
  <line x1="186" y1="286" x2="208" y2="286" stroke="#5a52c8" stroke-width="1.5" marker-end="url(#m)"/>

  <rect x="212" y="256" width="96" height="60" rx="9" fill="#ffffff" stroke="#8b7fd4"/>
  <text x="222" y="278" font-size="11.5" font-weight="700" fill="#272436">纯噪声</text>
  <text x="222" y="296" font-size="10.5" fill="#5a5670">初值 z_T</text>
  <line x1="308" y1="286" x2="330" y2="286" stroke="#5a52c8" stroke-width="1.5" marker-end="url(#m)"/>

  <rect x="334" y="250" width="150" height="72" rx="9" fill="#fff6e5" stroke="#b45309" stroke-width="1.4"/>
  <text x="344" y="272" font-size="11.5" font-weight="700" fill="#7c3a00">DiT × N 步</text>
  <text x="344" y="290" font-size="10.5" fill="#5a5670">N = 2–4（蒸馏后）</text>
  <text x="344" y="307" font-size="10.5" fill="#5a5670">N = 20–50（未蒸馏）</text>
  <line x1="484" y1="286" x2="506" y2="286" stroke="#5a52c8" stroke-width="1.5" marker-end="url(#m)"/>

  <rect x="510" y="256" width="104" height="60" rx="9" fill="#eef0ff" stroke="#5a52c8" stroke-width="1.4"/>
  <text x="520" y="278" font-size="11.5" font-weight="700" fill="#2e2a6f">潜变量 ẑ₀</text>
  <text x="520" y="296" font-size="10.5" fill="#5a5670">已“去噪”</text>
  <line x1="614" y1="286" x2="636" y2="286" stroke="#5a52c8" stroke-width="1.5" marker-end="url(#m)"/>

  <rect x="640" y="256" width="104" height="60" rx="9" fill="#ffffff" stroke="#8b7fd4"/>
  <text x="650" y="278" font-size="11.5" font-weight="700" fill="#272436">解码</text>
  <text x="650" y="296" font-size="10.5" fill="#5a5670">回像素</text>
  <line x1="744" y1="286" x2="766" y2="286" stroke="#5a52c8" stroke-width="1.5" marker-end="url(#m)"/>

  <rect x="770" y="250" width="154" height="72" rx="9" fill="#ffffff" stroke="#8b7fd4"/>
  <text x="780" y="272" font-size="11.5" font-weight="700" fill="#272436">一帧 / 一小段</text>
  <text x="780" y="290" font-size="10.5" fill="#5a5670">8 帧 @36 fps ≈ 222 ms</text>
  <text x="780" y="307" font-size="10.5" fill="#5a5670">拼成连续画面</text>

  <!-- Panel 3: autoregressive -->
  <rect x="20" y="356" width="920" height="146" rx="12" fill="#f6f5fb" stroke="#e3ddf1"/>
  <text x="36" y="380" font-size="12.5" font-weight="700" fill="#2e2a6f">③ 长视频：不是一次画完，而是一块一块往后接</text>

  <rect x="36" y="396" width="170" height="56" rx="9" fill="#ffffff" stroke="#8b7fd4"/>
  <text x="46" y="418" font-size="11.5" font-weight="700" fill="#272436">chunk k</text>
  <text x="46" y="437" font-size="10.5" fill="#5a5670">生成 8 帧</text>
  <line x1="206" y1="424" x2="236" y2="424" stroke="#5a52c8" stroke-width="1.5" marker-end="url(#m)"/>

  <rect x="240" y="396" width="184" height="56" rx="9" fill="#fff6e5" stroke="#b45309" stroke-width="1.4"/>
  <text x="250" y="418" font-size="11.5" font-weight="700" fill="#7c3a00">取最后一帧作初值</text>
  <text x="250" y="437" font-size="10.5" fill="#5a5670">加噪强度随运动量自适应</text>
  <line x1="424" y1="424" x2="454" y2="424" stroke="#5a52c8" stroke-width="1.5" marker-end="url(#m)"/>

  <rect x="458" y="396" width="170" height="56" rx="9" fill="#ffffff" stroke="#8b7fd4"/>
  <text x="468" y="418" font-size="11.5" font-weight="700" fill="#272436">chunk k+1</text>
  <text x="468" y="437" font-size="10.5" fill="#5a5670">条件换成最新特征</text>

  <path d="M543 452 L543 492 L121 492 L121 452" fill="none" stroke="#b45309" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ma)"/>
  <text x="205" y="486" font-size="10.5" fill="#7c3a00">上下文只保留最近若干帧 / 特征，长度可控</text>

  <rect x="662" y="392" width="262" height="94" rx="9" fill="#ffffff" stroke="#e3ddf1"/>
  <text x="674" y="412" font-size="11" font-weight="700" fill="#2e2a6f">工程上真正花时间的三件事</text>
  <text x="674" y="431" font-size="10.5" fill="#5a5670">· 少步蒸馏：20–50 步 → 2–4 步</text>
  <text x="674" y="449" font-size="10.5" fill="#5a5670">· 量化与算子拆分（INT8、Softmax 分解）</text>
  <text x="674" y="467" font-size="10.5" fill="#5a5670">· 缓存与调度：特征、KV、上一帧复用到什么程度</text>
</svg>
