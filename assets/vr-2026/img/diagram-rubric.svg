<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-label="100 分量规的七个维度及其权重">
  <style>
    .t{font:700 17px "Microsoft YaHei",sans-serif;fill:#2e2a6f}
    .s{font:12.5px "Microsoft YaHei",sans-serif;fill:#5a5670}
    .dim{font:700 13px "Microsoft YaHei",sans-serif;fill:#272436}
    .val{font:700 13px "Microsoft YaHei",sans-serif;fill:#5a52c8}
    .hint{font:11.5px "Microsoft YaHei",sans-serif;fill:#8b879e}
    .bg{fill:#efeaf9}
    .bar{fill:#5a52c8}
    .bar2{fill:#8b7fd4}
    .bar3{fill:#b8aee8}
    .sum{font:700 13px "Microsoft YaHei",sans-serif;fill:#b45309}
  </style>
  <rect width="960" height="400" fill="#fff"/>
  <text class="t" x="24" y="32">100 分怎么分：七个维度，权重从 25 到 8</text>
  <text class="s" x="24" y="53">硬门槛是闸门（过/不过/待核）；量规只在"过了"之后决定分数高低。</text>

  <g>
    <text class="dim" x="24" y="92">功能完备</text>
    <rect class="bg" x="200" y="78" width="660" height="18" rx="9"/>
    <rect class="bar" x="200" y="78" width="660" height="18" rx="9"/>
    <text class="val" x="874" y="92">25</text>

    <text class="dim" x="24" y="132">美观度</text>
    <rect class="bg" x="200" y="118" width="660" height="18" rx="9"/>
    <rect class="bar" x="200" y="118" width="528" height="18" rx="9"/>
    <text class="val" x="742" y="132">20</text>

    <text class="dim" x="24" y="172">交互与人因</text>
    <rect class="bg" x="200" y="158" width="660" height="18" rx="9"/>
    <rect class="bar2" x="200" y="158" width="396" height="18" rx="9"/>
    <text class="val" x="610" y="172">15</text>

    <text class="dim" x="24" y="212">VR 学科理解</text>
    <rect class="bg" x="200" y="198" width="660" height="18" rx="9"/>
    <rect class="bar2" x="200" y="198" width="317" height="18" rx="9"/>
    <text class="val" x="531" y="212">12</text>

    <text class="dim" x="24" y="252">性能与工程</text>
    <rect class="bg" x="200" y="238" width="660" height="18" rx="9"/>
    <rect class="bar3" x="200" y="238" width="264" height="18" rx="9"/>
    <text class="val" x="478" y="252">10</text>

    <text class="dim" x="24" y="292">演示与文档</text>
    <rect class="bg" x="200" y="278" width="660" height="18" rx="9"/>
    <rect class="bar3" x="200" y="278" width="264" height="18" rx="9"/>
    <text class="val" x="478" y="292">10</text>

    <text class="dim" x="24" y="332">课堂作业</text>
    <rect class="bg" x="200" y="318" width="660" height="18" rx="9"/>
    <rect class="bar3" x="200" y="318" width="211" height="18" rx="9"/>
    <text class="val" x="425" y="332">8</text>
  </g>

  <text class="sum" x="24" y="372">合计 100 分 · 功能完备一项就抵得上"美观 + 交互"两项</text>
</svg>
