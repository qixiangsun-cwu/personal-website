<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="注视停留时长的两个方向的代价：太短误触发、太长等待感，合适区间约 0.9 到 1.5 秒">
  <style>
    .card{fill:#f6f5fb;stroke:#ddd7f2;stroke-width:1.5}
    .t{font:600 15px "Microsoft YaHei",sans-serif;fill:#3b2f63}
    .s{font:12.5px "Microsoft YaHei",sans-serif;fill:#6b6288}
    .s2{font:12px "Microsoft YaHei",sans-serif;fill:#6b6288}
    .mono{font:12.5px Consolas,monospace;fill:#5a4d85}
    .ax{stroke:#c3bcd8;stroke-width:1.2;fill:none}
    .tick{stroke:#ddd7f2;stroke-width:1;fill:none}
    .mis{stroke:#c1502e;stroke-width:2.6;fill:none;stroke-linejoin:round}
    .wai{stroke:#d9a441;stroke-width:2.6;fill:none;stroke-linejoin:round}
    .band{fill:rgba(47,125,79,.16);stroke:none}
    .bandEdge{stroke:#2f7d4f;stroke-width:1.2;stroke-dasharray:5 4;fill:none}
    .red{fill:#c1502e;font:600 12.5px "Microsoft YaHei",sans-serif}
    .yel{fill:#a8791a;font:600 12.5px "Microsoft YaHei",sans-serif}
    .grn{fill:#2f7d4f;font:600 12.5px "Microsoft YaHei",sans-serif}
  </style>

  <rect class="card" x="12" y="16" width="620" height="288" rx="14"/>
  <text class="t" x="32" y="42">停留时长往两边偏，各有代价</text>
  <text class="s" x="32" y="64">横轴的横线是“几乎没有风险 / 几乎感觉不到”的基线；两条曲线方向相反。</text>

  <!-- 合适区间 -->
  <rect class="band" x="211.6" y="98" width="107.6" height="154"/>
  <line class="bandEdge" x1="211.6" y1="98" x2="211.6" y2="252"/>
  <line class="bandEdge" x1="319.1" y1="98" x2="319.1" y2="252"/>
  <text class="grn" x="219" y="80">合适区间 0.9—1.5 s</text>

  <!-- 坐标轴与刻度 -->
  <line class="ax" x1="104" y1="252" x2="600" y2="252"/>
  <line class="ax" x1="104" y1="98" x2="600" y2="98"/>
  <g class="tick">
    <line x1="104" y1="252" x2="104" y2="258"/><line x1="157.8" y1="252" x2="157.8" y2="258"/>
    <line x1="211.6" y1="252" x2="211.6" y2="258"/><line x1="265.3" y1="252" x2="265.3" y2="258"/>
    <line x1="319.1" y1="252" x2="319.1" y2="258"/><line x1="408.7" y1="252" x2="408.7" y2="258"/>
    <line x1="498.4" y1="252" x2="498.4" y2="258"/><line x1="588" y1="252" x2="588" y2="258"/>
  </g>
  <text class="mono" x="96" y="272">0.3</text>
  <text class="mono" x="152" y="272">0.6</text>
  <text class="mono" x="200" y="272">0.9</text>
  <text class="mono" x="254" y="272">1.2</text>
  <text class="mono" x="308" y="272">1.5</text>
  <text class="mono" x="398" y="272">2.0</text>
  <text class="mono" x="488" y="272">2.5</text>
  <text class="mono" x="578" y="272">3.0</text>
  <text class="s2" x="316" y="292">停留时长（秒）</text>

  <!-- 曲线 -->
  <path class="mis" d="M104.0 98.0 L113.0 112.7 L121.9 125.9 L130.9 137.9 L139.9 148.8 L148.8 158.6 L157.8 167.5 L166.7 175.5 L175.7 182.8 L184.7 189.4 L193.6 195.3 L202.6 200.7 L211.6 205.6 L220.5 210.0 L229.5 214.0 L238.4 217.6 L247.4 220.9 L256.4 223.9 L265.3 226.5 L274.3 229.0 L283.3 231.2 L292.2 233.1 L301.2 234.9 L310.1 236.6 L319.1 238.0 L328.1 239.4 L337.0 240.6 L346.0 241.7 L355.0 242.6 L363.9 243.5 L372.9 244.3 L381.9 245.1 L390.8 245.7 L399.8 246.3 L408.7 246.9 L417.7 247.3 L426.7 247.8 L435.6 248.2 L444.6 248.6 L453.6 248.9 L462.5 249.2 L471.5 249.4 L480.4 249.7 L489.4 249.9 L498.4 250.1 L507.3 250.3 L516.3 250.5 L525.3 250.6 L534.2 250.7 L543.2 250.9 L552.1 251.0 L561.1 251.1 L570.1 251.2 L579.0 251.2 L588.0 251.3"/>
  <path class="wai" d="M104.0 252.0 L113.0 244.1 L121.9 236.6 L130.9 229.5 L139.9 222.8 L148.8 216.4 L157.8 210.3 L166.7 204.5 L175.7 199.1 L184.7 193.9 L193.6 189.0 L202.6 184.3 L211.6 179.9 L220.5 175.7 L229.5 171.7 L238.4 167.9 L247.4 164.3 L256.4 160.9 L265.3 157.7 L274.3 154.7 L283.3 151.7 L292.2 149.0 L301.2 146.4 L310.1 143.9 L319.1 141.5 L328.1 139.3 L337.0 137.2 L346.0 135.2 L355.0 133.3 L363.9 131.5 L372.9 129.8 L381.9 128.1 L390.8 126.6 L399.8 125.1 L408.7 123.7 L417.7 122.4 L426.7 121.2 L435.6 120.0 L444.6 118.8 L453.6 117.8 L462.5 116.8 L471.5 115.8 L480.4 114.9 L489.4 114.0 L498.4 113.2 L507.3 112.4 L516.3 111.7 L525.3 111.0 L534.2 110.3 L543.2 109.7 L552.1 109.1 L561.1 108.5 L570.1 108.0 L579.0 107.5 L588.0 107.0"/>

  <!-- 1.2 s 竖线 -->
  <line x1="265.3" y1="98" x2="265.3" y2="252" stroke="#3b2f63" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="265.3" cy="226.5" r="4.5" fill="#c1502e"/>
  <circle cx="265.3" cy="157.7" r="4.5" fill="#d9a441"/>
  <text class="grn" x="256" y="150" text-anchor="end">本课默认 1.2 s</text>

  <!-- 曲线标注 -->
  <text class="red" x="104" y="80">误触发（红）</text>
  <text class="yel" x="470" y="106">等待感（黄）</text>
  <text class="s2" x="330" y="196">扫视掠过 8° 目标 ≈ 27 ms</text>

  <rect class="card" x="644" y="16" width="304" height="288" rx="14"/>
  <text class="t" x="664" y="44">这张图要说明什么</text>
  <text class="s" x="664" y="70">两个方向的代价不能同时最小，</text>
  <text class="s" x="664" y="88">所以只能选一个区间。</text>

  <circle cx="670" cy="114" r="4.5" fill="#c1502e"/>
  <text class="red" x="682" y="118">太短 → 误触发</text>
  <text class="s2" x="664" y="140">你只是盯着某处想事情，</text>
  <text class="s2" x="664" y="156">它当作你点了一下。</text>

  <circle cx="670" cy="186" r="4.5" fill="#d9a441"/>
  <text class="yel" x="682" y="190">太长 → 等待感</text>
  <text class="s2" x="664" y="212">每次跳转都要干等一秒多，</text>
  <text class="s2" x="664" y="228">六个房间就是十几次干等。</text>

  <text class="grn" x="664" y="256">本课约定值</text>
  <text class="s2" x="664" y="274">注视跳转 1.2 s · 退出 1.5 s</text>
  <text class="s2" x="664" y="290">长按手柄 2 s（要改就全班一起改）</text>
</svg>
