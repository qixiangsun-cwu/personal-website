<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Reality View 延迟预算：8 帧除以 36 fps 等于 222 毫秒，也等于 4 个 18 Hz 周期；与 VR 90 Hz 的 11.1 毫秒单帧预算相差约 20 倍">
  <style>
    .t{font:700 19px "Microsoft YaHei",sans-serif;fill:#2e2a6f}
    .s{font:12.5px "Microsoft YaHei",sans-serif;fill:#5a5670}
    .n{font:700 11.5px "Microsoft YaHei",sans-serif;fill:#5a52c8;letter-spacing:1px}
    .bt{font:700 14px "Microsoft YaHei",sans-serif;fill:#272436}
    .bd{font:11.5px "Microsoft YaHei",sans-serif;fill:#6b6483}
    .num{font:700 15px Consolas,monospace;fill:#b45309}
    .big{font:700 26px Consolas,monospace;fill:#b45309}
    .bar{fill:#8b7fd4}
    .bar2{fill:#e0b878}
    .bar3{fill:#58a6ff}
    .axis{stroke:#c9c3dd;stroke-width:1}
  </style>
  <rect width="960" height="440" fill="#fff"/>
  <text class="t" x="24" y="34">222 ms 是怎么来的，以及它为什么能接受</text>
  <text class="s" x="24" y="56">两条独立路径算出同一个数；⚠️ 它是马斯克三个数字的算术推论，不是独立实测。</text>

  <!-- 时间轴 -->
  <text class="n" x="24" y="90">路径 A · 播放窗口</text>
  <rect x="180" y="78" width="660" height="26" rx="4" fill="#f0ecfa" stroke="#ddd7f2"/>
  <g stroke="#8b7fd4" stroke-width="1.3">
    <line x1="180" y1="78" x2="180" y2="104"/><line x1="345" y1="78" x2="345" y2="104"/>
    <line x1="510" y1="78" x2="510" y2="104"/><line x1="675" y1="78" x2="675" y2="104"/>
    <line x1="840" y1="78" x2="840" y2="104"/>
  </g>
  <text class="bd" x="180" y="120">0</text>
  <text class="bd" x="318" y="120">55.6</text>
  <text class="bd" x="483" y="120">111.1</text>
  <text class="bd" x="648" y="120">166.7</text>
  <text class="bd" x="806" y="120">222 ms</text>
  <text class="bd" x="180" y="140">每个刻度 = 1 个 UVE 周期（1/18 s）　·　4 个周期 = 8 帧 @36 fps = 0.222 s</text>

  <!-- 三条算式 -->
  <g>
    <rect x="24" y="158" width="286" height="80" rx="10" fill="#f6f5fb" stroke="#ddd7f2" stroke-width="1.4"/>
    <text class="n" x="40" y="180">生成侧</text>
    <text class="big" x="40" y="210">8 ÷ 36 = 0.222 s</text>
    <text class="bd" x="40" y="228">8 帧画面，按 36 fps 播放</text>
  </g>
  <g>
    <rect x="330" y="158" width="286" height="80" rx="10" fill="#f6f5fb" stroke="#ddd7f2" stroke-width="1.4"/>
    <text class="n" x="346" y="180">编码侧</text>
    <text class="big" x="346" y="210">4 ÷ 18 = 0.222 s</text>
    <text class="bd" x="346" y="228">4 个特征周期，每周期 55.6 ms</text>
  </g>
  <g>
    <rect x="636" y="158" width="300" height="80" rx="10" fill="#fdf3e6" stroke="#e0b878" stroke-width="1.4"/>
    <text class="n" x="652" y="180" fill="#b45309">换算成空间误差</text>
    <text class="big" x="652" y="210">0.222 × 16 ≈ 3.6 m</text>
    <text class="bd" x="652" y="228">教材默认车速 16 m/s；30 m/s 时约 6.6 m</text>
  </g>

  <!-- 对比条 -->
  <text class="n" x="24" y="278">和 VR 帧预算对撞（同一把尺）</text>
  <g>
    <text class="bt" x="24" y="310">VR @90 Hz</text>
    <rect class="bar" x="180" y="298" width="30" height="16" rx="3"/>
    <text class="bd" x="220" y="311">11.1 ms　—— 超一点就开始晕</text>

    <text class="bt" x="24" y="340">VR @72 Hz</text>
    <rect class="bar" x="180" y="328" width="38" height="16" rx="3"/>
    <text class="bd" x="228" y="341">13.9 ms　—— 课程里反复出现的单帧预算</text>

    <text class="bt" x="24" y="370">头显 MTP</text>
    <rect class="bar" x="180" y="358" width="108" height="16" rx="3"/>
    <text class="bd" x="298" y="371">典型 20–40 ms（2–4 帧）</text>

    <text class="bt" x="24" y="400">Reality View</text>
    <rect class="bar2" x="180" y="388" width="600" height="16" rx="3"/>
    <text class="bd" x="790" y="401"><tspan class="num">222 ms</tspan> ≈ 20×</text>
  </g>

  <text class="s" x="24" y="428">判断能不能忍 200 ms，不取决于数字本身，取决于你在做「控制」还是「显示」。　图：本页绘制</text>
</svg>
