<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="222 毫秒窗口动画：8 路相机采集对齐，UVE 编码器 18 Hz，生成 8 帧每秒 36 帧，最后合成显示；播放头循环扫过整条流水线，下方与 VR 90 Hz 的 11.1 毫秒单帧预算对照">
  <style>
    text{font-family:"Microsoft YaHei",sans-serif}
    .t{font:700 19px "Microsoft YaHei",sans-serif;fill:#2e2a6f}
    .s{font:12.5px "Microsoft YaHei",sans-serif;fill:#5a5670}
    .st{font:700 12px "Microsoft YaHei",sans-serif;fill:#2e2a6f}
    .sd{font:11px "Microsoft YaHei",sans-serif;fill:#6b6483}
    .num{font:700 12px Consolas,monospace;fill:#b45309}
    .ok{font:700 12px "Microsoft YaHei",sans-serif;fill:#2e7d32}
    .ph{animation:sweep 3s linear infinite}
    .dot{animation:pop 3s linear infinite;opacity:.12}
    @keyframes sweep{
      0%{transform:translateX(0)}
      86%{transform:translateX(732px)}
      100%{transform:translateX(732px)}
    }
    @keyframes pop{
      0%{opacity:.12}
      6%{opacity:1}
      88%{opacity:1}
      96%{opacity:.12}
      100%{opacity:.12}
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b7fd4"/></marker>
  </defs>
  <rect width="960" height="380" fill="#fff"/>
  <text class="t" x="24" y="34">222 ms 是一段窗口，不是一次点击</text>
  <text class="s" x="24" y="56">一条流水线走完四个阶段；播放头（白色竖线）每 3 秒扫一遍，就是屏幕上“重画一次世界”的节奏。</text>

  <!-- 阶段块 -->
  <rect x="96" y="112" width="148" height="48" rx="8" fill="#f6f5fb" stroke="#ddd7f2" stroke-width="1.5"/>
  <rect x="244" y="112" width="182" height="48" rx="8" fill="#eeeafb" stroke="#8b7fd4" stroke-width="1.8"/>
  <rect x="426" y="112" width="346" height="48" rx="8" fill="#fdf3e6" stroke="#e0b878" stroke-width="1.8"/>
  <rect x="772" y="112" width="56" height="48" rx="8" fill="#f3f1fa" stroke="#b9b0e0" stroke-width="1.8"/>

  <text class="st" x="104" y="106">S0 采集对齐</text>
  <text class="st" x="252" y="106">S1 UVE 编码</text>
  <text class="st" x="434" y="106">S3 生成 8 帧</text>
  <text class="st" x="768" y="106" text-anchor="end">S4 显示</text>

  <text class="sd" x="104" y="132">8 路相机</text>
  <text class="sd" x="104" y="148">时间戳 + 标定</text>

  <text class="sd" x="252" y="132">18 Hz 特征流</text>
  <text class="sd" x="252" y="148">共享给两个任务头</text>

  <text class="sd" x="434" y="132">@ 36 fps · 上一帧作记忆，UVE 特征作纠正</text>

  <text class="sd" x="800" y="140" text-anchor="middle">合成</text>

  <!-- 8 帧圆点 -->
  <g fill="#fff" stroke="#b45309" stroke-width="1.6">
    <circle class="dot" cx="452" cy="152" r="3.6" style="animation-delay:0s"/>
    <circle class="dot" cx="495" cy="152" r="3.6" style="animation-delay:.13s"/>
    <circle class="dot" cx="538" cy="152" r="3.6" style="animation-delay:.26s"/>
    <circle class="dot" cx="581" cy="152" r="3.6" style="animation-delay:.39s"/>
    <circle class="dot" cx="624" cy="152" r="3.6" style="animation-delay:.52s"/>
    <circle class="dot" cx="667" cy="152" r="3.6" style="animation-delay:.65s"/>
    <circle class="dot" cx="710" cy="152" r="3.6" style="animation-delay:.78s"/>
    <circle class="dot" cx="753" cy="152" r="3.6" style="animation-delay:.91s"/>
  </g>

  <!-- 时间标注 -->
  <text class="num" x="96" y="178">0</text>
  <text class="num" x="828" y="178" text-anchor="middle">222 ms</text>
  <text class="sd" x="426" y="178">100 ms — 特征就位</text>

  <!-- 总括号 -->
  <path d="M96,192 L96,200 L828,200 L828,192" fill="none" stroke="#b45309" stroke-width="1.6"/>
  <text class="num" x="462" y="216" text-anchor="middle">222 ms ＝ 8 帧 ÷ 36 fps ＝ 4 个 18 Hz 周期</text>

  <!-- 播放头 -->
  <g class="ph">
    <line x1="96" y1="94" x2="96" y2="190" stroke="#272436" stroke-width="2" stroke-opacity=".55"/>
    <path d="M92,92 L100,92 L96,86 z" fill="#272436"/>
    <circle cx="96" cy="136" r="4.2" fill="#272436"/>
  </g>

  <!-- 下方对照 -->
  <line x1="24" y1="244" x2="936" y2="244" stroke="#efebf8" stroke-width="1"/>
  <text class="st" x="24" y="270">同一个“延迟”，两种命运</text>

  <text class="sd" x="24" y="300">VR 头显 · 90 Hz 单帧</text>
  <rect x="180" y="290" width="26" height="14" rx="3" fill="#2e7d32"/>
  <text class="ok" x="216" y="301">11.1 ms　超预算就开始晕（控制回路）</text>

  <text class="sd" x="24" y="334">车机屏 · Reality View</text>
  <rect x="180" y="324" width="520" height="14" rx="3" fill="#b45309"/>
  <text class="num" x="712" y="335">222 ms　只影响“理解”</text>

  <path d="M206,306 L206,326" stroke="#8b879e" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="sd" x="24" y="362">条形长度按同一比例尺绘制：222 ms 约为 11.1 ms 的 20 倍。动画只表达时序，不代表真实画质。</text>
</svg>

