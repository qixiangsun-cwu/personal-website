<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 362" width="960" height="362" role="img" aria-label="222 毫秒的两条独立时间尺">
  <style>
    text{font-family:'Times New Roman','SimSun',serif;fill:#23202f}
    .cn{font-family:'SimSun','Songti SC','Times New Roman',serif}
    .mut{fill:#6b6483}
    .num{fill:#b45309}
    .ac{fill:#6d5bd0}
    .fig{font-style:italic;fill:#8b879e}
    .h{font-weight:700}
  </style>
  <rect width="960" height="362" fill="#ffffff"/>

  <text class="fig" x="30" y="30" font-size="12">Fig. 2</text>
  <text class="cn mut" x="84" y="30" font-size="12">两条互不相干的尺，落在同一个数上：0.222 s</text>
  <line x1="30" y1="40" x2="620" y2="40" stroke="#d9d5e6" stroke-width="1"/>

  <!-- 行标签 -->
  <text class="cn mut" x="112" y="70" font-size="12" text-anchor="end">帧尺</text>
  <text class="cn h" x="112" y="90" font-size="12" text-anchor="end">36 fps</text>
  <text class="cn mut" x="112" y="134" font-size="12" text-anchor="end">特征尺</text>
  <text class="cn h" x="112" y="154" font-size="12" text-anchor="end">18 Hz</text>

  <!-- 帧尺：8 格，每格 1/36 s -->
  <g>
    <rect x="120" y="88" width="680" height="34" fill="#f3f0fb" stroke="#c9c1e3" stroke-width="1"/>
    <g stroke="#c9c1e3" stroke-width="1">
      <line x1="205" y1="88" x2="205" y2="122"/><line x1="290" y1="88" x2="290" y2="122"/>
      <line x1="375" y1="88" x2="375" y2="122"/><line x1="460" y1="88" x2="460" y2="122"/>
      <line x1="545" y1="88" x2="545" y2="122"/><line x1="630" y1="88" x2="630" y2="122"/>
      <line x1="715" y1="88" x2="715" y2="122"/>
    </g>
    <text class="num" x="162" y="110" font-size="11" text-anchor="middle">1/36 s</text>
    <text class="num" x="247" y="110" font-size="11" text-anchor="middle">1/36 s</text>
    <text class="num" x="332" y="110" font-size="11" text-anchor="middle">1/36 s</text>
    <text class="num" x="417" y="110" font-size="11" text-anchor="middle">1/36 s</text>
    <text class="num" x="502" y="110" font-size="11" text-anchor="middle">1/36 s</text>
    <text class="num" x="587" y="110" font-size="11" text-anchor="middle">1/36 s</text>
    <text class="num" x="672" y="110" font-size="11" text-anchor="middle">1/36 s</text>
    <text class="num" x="757" y="110" font-size="11" text-anchor="middle">1/36 s</text>
  </g>
  <text class="cn mut" x="800" y="80" font-size="11" text-anchor="end">一批 8 帧</text>

  <!-- 特征尺：4 格，每格 4 个周期 -->
  <g>
    <rect x="120" y="146" width="680" height="32" fill="#fdf6ec" stroke="#e6d3b3" stroke-width="1"/>
    <g stroke="#e6d3b3" stroke-width="1">
      <line x1="290" y1="146" x2="290" y2="178"/><line x1="460" y1="146" x2="460" y2="178"/>
      <line x1="630" y1="146" x2="630" y2="178"/>
    </g>
    <text class="num" x="205" y="167" font-size="11" text-anchor="middle">4 × 18 Hz</text>
    <text class="num" x="375" y="167" font-size="11" text-anchor="middle">4 × 18 Hz</text>
    <text class="num" x="545" y="167" font-size="11" text-anchor="middle">4 × 18 Hz</text>
    <text class="num" x="715" y="167" font-size="11" text-anchor="middle">4 × 18 Hz</text>
  </g>
  <text class="cn mut" x="800" y="140" font-size="11" text-anchor="end">每 4 个周期供一次生成</text>

  <!-- 对齐线 -->
  <g stroke="#9b93bd" stroke-width="1" stroke-dasharray="4 4">
    <line x1="120" y1="70" x2="120" y2="196"/>
    <line x1="460" y1="70" x2="460" y2="196"/>
    <line x1="800" y1="70" x2="800" y2="196"/>
  </g>

  <!-- 等式 -->
  <text class="num" x="814" y="112" font-size="12">8 ÷ 36 = 0.222 s</text>
  <text class="num" x="814" y="168" font-size="12">4 ÷ 18 = 0.222 s</text>
  <text class="cn mut" x="814" y="190" font-size="11">两条路径独立吻合</text>

  <!-- 位移 -->
  <g>
    <path d="M120 232 L800 232" stroke="#b45309" stroke-width="1.2"/>
    <path d="M800 232 l-9 -4 M800 232 l-9 4" stroke="#b45309" stroke-width="1.2" fill="none"/>
    <text class="cn mut" x="120" y="252" font-size="11">位移：0.222 s × 16 m/s ≈ 3.6 m（画面比真实世界晚这么远）</text>
  </g>

  <!-- VR 对照条 -->
  <text class="cn mut" x="120" y="278" font-size="11">VR 90 Hz 单帧预算</text>
  <rect x="120" y="284" width="35" height="12" fill="#6d5bd0"/>
  <text class="num" x="163" y="295" font-size="11">11.1 ms</text>
  <text class="cn mut" x="222" y="295" font-size="11">← 同一条“延迟”，相差约 20 倍</text>

  <!-- 时间轴 -->
  <line x1="120" y1="332" x2="800" y2="332" stroke="#23202f" stroke-width="1"/>
  <g stroke="#23202f" stroke-width="1">
    <line x1="120" y1="328" x2="120" y2="336"/><line x1="460" y1="328" x2="460" y2="336"/><line x1="800" y1="328" x2="800" y2="336"/>
  </g>
  <text class="num" x="120" y="348" font-size="10" text-anchor="middle">0</text>
  <text class="num" x="460" y="348" font-size="10" text-anchor="middle">111</text>
  <text class="num" x="800" y="348" font-size="10" text-anchor="middle">222</text>
  <text class="cn mut" x="812" y="348" font-size="10">ms</text>
</svg>
