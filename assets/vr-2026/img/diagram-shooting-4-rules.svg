<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="全景拍摄四要点示意：锁定参数、绕镜头节点转、重叠率、补天补地">
  <style>
    .card{fill:#f6f5fb;stroke:#ddd7f2;stroke-width:1.5}
    .t{font:600 14.5px "Microsoft YaHei",sans-serif;fill:#3b2f63}
    .s{font:12px "Microsoft YaHei",sans-serif;fill:#6b6288}
    .red{fill:#c1502e;font:600 12px "Microsoft YaHei",sans-serif}
    .grn{fill:#2f7d4f;font:600 12px "Microsoft YaHei",sans-serif}
    .ln{stroke:#8b7fd4;stroke-width:1.6;fill:none}
    .lnr{stroke:#c1502e;stroke-width:1.8;fill:none}
    .lng{stroke:#2f7d4f;stroke-width:1.8;fill:none}
    .dot{fill:#8b7fd4}
    .box{fill:#b9aee8}
    .box2{fill:#f0dcb8}
    .dash{stroke:#e0a08c;stroke-width:1.2;stroke-dasharray:4 3;fill:#ffe9e4}
  </style>
  <rect width="960" height="300" fill="#fff"/>

  <!-- ① 锁定参数 -->
  <g transform="translate(20,20)">
    <rect class="card" width="215" height="260" rx="12"/>
    <text class="t" x="14" y="26">① 参数全程不变</text>
    <g transform="translate(20,48)">
      <rect class="box" x="0" y="0" width="32" height="8" rx="3"/>
      <rect class="box" x="0" y="16" width="32" height="8" rx="3" fill="#cfc7ef"/>
      <rect class="box" x="0" y="32" width="32" height="8" rx="3"/>
      <rect x="44" y="4" width="110" height="34" rx="6" fill="none" stroke="#8b7fd4" stroke-width="2"/>
      <path class="ln" d="M62,10 v10 a8,8 0 0 0 16,0 v-10" />
      <circle class="dot" cx="70" cy="13" r="4"/>
      <text class="s" x="-8" y="60" style="font-size:11px">光圈 · 快门 · ISO · 白平衡 · 对焦</text>
    </g>
    <text class="s" x="14" y="176">一变，拼缝处就会出现</text>
    <text class="red" x="14" y="196">一条明显的亮暗分界（接缝条）</text>
    <text class="s" x="14" y="226">软件要假设“同一时刻”</text>
  </g>

  <!-- ② 绕节点转 -->
  <g transform="translate(255,20)">
    <rect class="card" width="215" height="260" rx="12"/>
    <text class="t" x="14" y="26">② 绕镜头节点转</text>
    <g transform="translate(18,44)">
      <circle class="dot" cx="20" cy="40" r="5"/>
      <path class="lng" d="M20,40 m0,-30 a30,30 0 1 1 -0.1,0"/>
      <rect class="box" x="86" y="30" width="10" height="26"/>
      <text class="grn" x="86" y="26">✔ 近处不跑位</text>
      <path class="lnr" d="M20,100 m0,-30 a30,30 0 1 1 -0.1,0"/>
      <circle class="dot" cx="50" cy="100" r="5"/>
      <rect x="86" y="90" width="10" height="26" fill="#e6a894"/>
      <rect class="dash" x="80" y="90" width="10" height="26"/>
      <text class="red" x="86" y="86">✘ 原地转头会错位</text>
    </g>
    <text class="s" x="14" y="204">相机移动 → 有视差</text>
    <text class="s" x="14" y="224">→ 拼出“鬼影”</text>
    <text class="s" x="14" y="246" fill="#3b2f63">这是全景与普通摄影最大的区别</text>
  </g>

  <!-- ③ 重叠率 -->
  <g transform="translate(490,20)">
    <rect class="card" width="215" height="260" rx="12"/>
    <text class="t" x="14" y="26">③ 重叠不少于 25%</text>
    <g transform="translate(20,56)">
      <rect x="0" y="0" width="80" height="56" rx="5" fill="#ded8f5" stroke="#8b7fd4"/>
      <rect x="56" y="0" width="80" height="56" rx="5" fill="#efeaf9" stroke="#8b7fd4"/>
      <rect x="56" y="0" width="24" height="56" fill="#c9bff0" opacity=".9"/>
      <text class="s" x="60" y="34" fill="#3b2f63">30%</text>
      <rect x="112" y="0" width="80" height="56" rx="5" fill="#ded8f5" stroke="#8b7fd4" opacity=".55"/>
      <text class="s" x="120" y="76">每两张之间留出重叠</text>
    </g>
    <text class="s" x="14" y="176">首尾也必须重叠</text>
    <text class="grn" x="14" y="196">→ 一圈才合得拢</text>
    <text class="s" x="14" y="226">25% 是下限，不是目标</text>
  </g>

  <!-- ④ 补天补地 -->
  <g transform="translate(725,20)">
    <rect class="card" width="215" height="260" rx="12"/>
    <text class="t" x="14" y="26">④ 上下各 45° + 补天补地</text>
    <g transform="translate(107,104)">
      <circle class="ln" cx="0" cy="0" r="46"/>
      <ellipse class="ln" cx="0" cy="0" rx="46" ry="16"/>
      <path class="lng" d="M-46,0 a46,46 0 0 0 92,0" />
      <path class="ln" d="M-46,0 a46,46 0 0 1 92,0" />
      <circle class="box2" cx="0" cy="-40" r="12"/>
      <circle class="box2" cx="0" cy="40" r="12"/>
      <text class="s" x="-24" y="-52" fill="#c1502e">补天</text>
      <text class="s" x="-24" y="66" fill="#c1502e">补地</text>
    </g>
    <text class="s" x="14" y="204">上下两圈覆盖天顶与地面</text>
    <text class="s" x="14" y="226">那里畸变最大，单独拍最稳</text>
  </g>
</svg>
