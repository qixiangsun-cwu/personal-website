<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="降级阶梯：L0 全量到 L4 关闭，屏上信息逐级减少，但绿色真值通道（转向、限速、下一动作）始终保持不变">
  <style>
    text{font-family:"Microsoft YaHei",sans-serif}
    .t{font:700 19px "Microsoft YaHei",sans-serif;fill:#2e2a6f}
    .s{font:12.5px "Microsoft YaHei",sans-serif;fill:#5a5670}
    .lv{font:700 12.5px "Microsoft YaHei",sans-serif;fill:#2e2a6f}
    .lv4{font:700 12.5px "Microsoft YaHei",sans-serif;fill:#8b879e}
    .d{font:11.5px "Microsoft YaHei",sans-serif;fill:#5a5670}
    .d4{font:11.5px "Microsoft YaHei",sans-serif;fill:#8b879e}
    .ok{font:700 12px "Microsoft YaHei",sans-serif;fill:#2e7d32}
  </style>
  <rect width="960" height="320" fill="#fff"/>
  <text class="t" x="24" y="34">降级不是“关掉功能”，是“逐层交出画面、绝不交出事实”</text>
  <text class="s" x="24" y="56">越往右下，屏幕上剩的东西越少；但绿色那条线从头到尾没动过。</text>

  <!-- 真值通道 -->
  <rect x="24" y="74" width="912" height="30" rx="7" fill="#eaf5eb" stroke="#a9cfa9" stroke-width="1.4"/>
  <text class="ok" x="40" y="94">真值通道（意图叠加层）· 从不降级：转向 chevron / 限速 / 下一动作，取当前规划，0 ms</text>

  <!-- 阶梯 -->
  <rect x="24" y="124" width="188" height="148" rx="4" fill="#eeeafb" stroke="#8b7fd4" stroke-width="1.5"/>
  <rect x="212" y="156" width="188" height="116" rx="4" fill="#f2effa" stroke="#a79dd8" stroke-width="1.4"/>
  <rect x="400" y="188" width="188" height="84" rx="4" fill="#f6f4fb" stroke="#c3bce4" stroke-width="1.3"/>
  <rect x="588" y="216" width="188" height="56" rx="4" fill="#faf9fd" stroke="#d8d3ea" stroke-width="1.2"/>
  <rect x="776" y="246" width="160" height="26" rx="4" fill="#f5f4f7" stroke="#dcdae3" stroke-width="1.2" stroke-dasharray="4 3"/>

  <text class="lv" x="38" y="148">L0 全量</text>
  <text class="d" x="38" y="170">生成画面 + 全部叠加层</text>
  <text class="d" x="38" y="190">默认状态</text>

  <text class="lv" x="226" y="180">L1 Calm</text>
  <text class="d" x="226" y="202">车速 / 限速 / 下一转向</text>
  <text class="d" x="226" y="222">用户主动开启或免打扰</text>

  <text class="lv" x="414" y="212">L2 分屏</text>
  <text class="d" x="414" y="234">地图 + 缩小的实景</text>
  <text class="d" x="414" y="252">导航需求高时</text>

  <text class="lv" x="602" y="240">L3 纯地图</text>
  <text class="d" x="602" y="260">只剩路线与位置</text>

  <text class="lv4" x="790" y="258">L4 关闭（HW3）</text>

  <!-- 基线 -->
  <line x1="24" y1="272" x2="936" y2="272" stroke="#d8d3ea" stroke-width="1.4"/>
  <text class="s" x="936" y="288" text-anchor="end">→ 屏上信息量递减</text>

  <text class="d" x="24" y="296">课上只说一句：先砍质量，再砍频率，最后砍功能——但那条绿色的线（你自己作品里的“哪一层是事实”）一次都不能砍。</text>
  <text class="d" x="24" y="312">L0—L3 是软件层降级；L4 是硬件层缺失（HW3 根本跑不了 v15）。把“降级”与“不支持”分开讲，学生才不会混。</text>
</svg>

