    <circle cx="103" cy="44" r="10" fill="url(#bearG)"/>
    <circle cx="57" cy="44" r="5" fill="#FFE0BB" fill-opacity="0.85"/>
    <circle cx="103" cy="44" r="5" fill="#FFE0BB" fill-opacity="0.85"/>
    <circle cx="80" cy="55" r="25" fill="url(#bearG)"/>
    <ellipse cx="80" cy="63" rx="13" ry="10" fill="#FFE7C9" fill-opacity="0.92"/>
    <circle cx="71" cy="49" r="3.1" fill="#6B3B14"/>
    <circle cx="89" cy="49" r="3.1" fill="#6B3B14"/>
    <path d="M76 62c1.6 2.2 6.4 2.2 8 0" fill="none" stroke="#6B3B14" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="80" cy="57.5" rx="3.4" ry="2.6" fill="#8A4C18"/>
