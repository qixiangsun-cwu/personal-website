<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">纸书智伴 · picture book companion</title>
  <desc id="desc">An open picture book with a friendly bear-eared bookmark and a warm reading glow.</desc>
  <defs>
    <linearGradient id="tile" x1="14" y1="10" x2="146" y2="152" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFAF2"/>
      <stop offset="0.5" stop-color="#FDEEDA"/>
      <stop offset="1" stop-color="#F7DCC2"/>
    </linearGradient>
    <linearGradient id="pageL" x1="30" y1="82" x2="78" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF3E4"/>
    </linearGradient>
    <linearGradient id="pageR" x1="130" y1="82" x2="82" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFEBD6"/>
    </linearGradient>
    <radialGradient id="bearG" cx="0" cy="0" r="1" gradientTransform="translate(72 52) rotate(64) scale(46 40)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFC98A"/>
      <stop offset="0.55" stop-color="#F2A059"/>
      <stop offset="1" stop-color="#D97B34"/>
    </radialGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(80 96) scale(60 44)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB964" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFB964" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#B07038" flood-opacity="0.2"/>
    </filter>
    <filter id="bearSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#9C5A22" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="4" y="4" width="152" height="152" rx="48" fill="url(#tile)"/>
  <rect x="5" y="5" width="150" height="150" rx="47" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>

  <ellipse cx="80" cy="96" rx="60" ry="44" fill="url(#glow)"/>

  <g filter="url(#soft)">
    <path d="M32 84c14-7 30-7 46 0v46c-16-7-32-7-46 0V84Z" fill="url(#pageL)"/>
    <path d="M128 84c-14-7-30-7-46 0v46c16-7 32-7 46 0V84Z" fill="url(#pageR)"/>
  </g>
  <path d="M32 84c14-7 30-7 46 0" fill="none" stroke="#E7C49B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M128 84c-14-7-30-7-46 0" fill="none" stroke="#E7C49B" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M78 84v46" stroke="#E0BC90" stroke-width="2.6" stroke-linecap="round"/>
  <g fill="none" stroke="#D9B486" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
    <path d="M41 95h25"/>
    <path d="M41 103h25"/>
    <path d="M41 111h17"/>
    <path d="M94 95h25"/>
    <path d="M94 103h19"/>
    <path d="M94 111h25"/>
  </g>

