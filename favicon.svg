<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a3a7a"/>
    </linearGradient>
  </defs>
  <!-- 深蓝圆形背景 -->
  <circle cx="16" cy="16" r="15.5" fill="url(#bg)"/>
  <!-- 外圈装饰环 -->
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#3b6db5" stroke-width="0.6" opacity="0.5"/>
  <!-- 女字主体 - 白色，居中 -->
  <text x="16" y="22.5" text-anchor="middle" font-family="SimSun, 'Noto Serif SC', 'Songti SC', serif" font-size="19" font-weight="bold" fill="#ffffff">女</text>
  <!-- 底部小弧线装饰 - 呼应女院校标的三心造型 -->
