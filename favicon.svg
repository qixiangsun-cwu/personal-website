<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a3a7a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a9eff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- 深蓝圆形背景 -->
  <circle cx="16" cy="16" r="15.5" fill="url(#bg)"/>
  <!-- 神经网络节点 - AI图标 -->
  <!-- 顶层3个节点 -->
  <circle cx="10" cy="9" r="2" fill="url(#glow)" opacity="0.9"/>
  <circle cx="16" cy="7" r="2" fill="url(#glow)" opacity="0.9"/>
  <circle cx="22" cy="9" r="2" fill="url(#glow)" opacity="0.9"/>
  <!-- 中层2个节点 -->
  <circle cx="12" cy="16" r="2.2" fill="url(#glow)"/>
  <circle cx="20" cy="16" r="2.2" fill="url(#glow)"/>
  <!-- 底层1个节点 -->
  <circle cx="16" cy="23" r="2.5" fill="#ffffff"/>
  <!-- 连接线 - 顶到中 -->
  <line x1="10" y1="11" x2="12" y2="14" stroke="#4a9eff" stroke-width="0.7" opacity="0.5"/>
  <line x1="16" y1="9" x2="12" y2="14" stroke="#4a9eff" stroke-width="0.7" opacity="0.5"/>
  <line x1="16" y1="9" x2="20" y2="14" stroke="#4a9eff" stroke-width="0.7" opacity="0.5"/>
  <line x1="22" y1="11" x2="20" y2="14" stroke="#4a9eff" stroke-width="0.7" opacity="0.5"/>
  <!-- 连接线 - 中到底 -->
  <line x1="12" y1="18" x2="16" y2="21" stroke="#4a9eff" stroke-width="0.8" opacity="0.6"/>
  <line x1="20" y1="18" x2="16" y2="21" stroke="#4a9eff" stroke-width="0.8" opacity="0.6"/>
  <!-- 连接线 - 中间横连 -->
  <line x1="14" y1="16" x2="18" y2="16" stroke="#4a9eff" stroke-width="0.5" opacity="0.3"/>
</svg>
